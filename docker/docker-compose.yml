# DDMSAA ローカル開発環境（spec-01 §3：Docker で PostgreSQL・Redis・pgAdmin・Nginx を起動する）。
# バックエンド（mvn spring-boot:run）とフロントエンド（pnpm dev）はホストで実行する。
# 使い方は docker/README.md。環境変数は docker/.env（docker/.env.example を複製して作る）。
name: ddmsaa

services:
  postgres:
    image: postgres:16
    container_name: ddmsaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      DB_NAME: ${DB_NAME:-ddmsaa}
      DB_USER: ${DB_USER:-ddmsaa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../docs/基本設計/データベース/setup:/setup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ddmsaa} -d ${DB_NAME:-ddmsaa}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: ddmsaa-redis
    restart: unless-stopped
    # Magic Link の一時状態用。業務データは保持しないため永続化しない。
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ddmsaa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in docker/.env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:stable
    container_name: ddmsaa-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 開発用メール受信箱（Magic Link の確認用）。既定では起動しない：docker compose --profile mail up -d
  # 使うときはバックエンドの MAIL_HOST=localhost、MAIL_PORT=1025 を設定する。（導入は未確認事項。docker/README.md 参照）
  mailpit:
    image: axllent/mailpit:latest
    container_name: ddmsaa-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  pgadmin-data:
