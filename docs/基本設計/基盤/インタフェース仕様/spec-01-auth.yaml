meta:
  system: DDMSAA
  module: auth
  version: 1.0
  authority: "../../共通/spec-07-api-list.yaml"
contracts:
  login:
    method: POST
    path: /api/auth/login
    request:
      loginId: string
      password: string
    success:
      status: 200
      cookie: "DDMSAA_SESSION; HttpOnly; Secure; SameSite=Lax"
      body: { userId: uuid, displayName: string, role: "ADMIN|EMPLOYEE|CUSTOMER" }
    failures:
      - { status: 401, condition: "ID 不明・パスワード不一致・無効利用者。理由は区別しない" }
      - { status: 423, condition: "5 回連続失敗後、locked_until まで" }
  logout:
    method: POST
    path: /api/auth/logout
    request: { csrfHeader: X-CSRF-Token }
    success: { status: 204, effect: "user_sessions.revoked_at を設定し Cookie を削除" }
  me:
    method: GET
    path: /api/auth/me
    success:
      status: 200
      body: { userId: uuid, loginId: string, displayName: string, role: "ADMIN|EMPLOYEE|CUSTOMER", customerId: "uuid|null" }
security:
  password:
    storage: "BCrypt hash only"
    plaintext_storage: forbidden
  session:
    storage: "user_sessions.token_hash"
    expiration: "8 hours"
    revoke_on: [logout, user_disabled, password_changed]
  lockout:
    failures: 5
    duration: "30 minutes"
  csrf:
    required_for: [POST, PUT, DELETE]
  excluded: ["email-link authentication", "SMS authentication", "JWT refresh token"]
roles:
  ADMIN: "全データと管理機能"
  EMPLOYEE: "割当済み顧客のみ"
  CUSTOMER: "自顧客の閲覧のみ"
