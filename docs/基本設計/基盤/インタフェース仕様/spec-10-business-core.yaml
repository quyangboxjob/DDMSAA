meta:
  system: DDMSAA
  module: business-core
rules:
  access_scope:
    ADMIN: "all customers and all orders"
    EMPLOYEE: "customers with active employee_customer_assignments"
    CUSTOMER: "only own customer_id; no create/update/approve/upload/export"
  order:
    editable_statuses: [DRAFT, RETURNED]
    submit_transition: "DRAFT|RETURNED -> PENDING_APPROVAL"
    approved_change: "direct update forbidden; cancel then create a new order referencing revised_from_order_id when correction is needed"
    tax: "line_amount=quantity*unit_price; tax_amount=HALF_UP(line_amount*tax_rate/100); totals are recalculated on the server"
  approval:
    initial_route: "amount >= 0, sequence 1, ADMIN role"
    snapshot: "route is copied to approval_requests at submit time"
  attachment:
    allowed: [pdf, docx, xlsx, csv, png, jpg, jpeg]
    max_file_bytes: 10485760
    max_order_bytes: 52428800
    download: "SAFE only; CUSTOMER requires CUSTOMER visibility and own customer"
  export:
    csv_encoding: UTF-8_BOM
    async_over_records: 10000
    expiry_hours: 24
