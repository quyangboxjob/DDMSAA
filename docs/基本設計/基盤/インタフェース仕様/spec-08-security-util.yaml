meta:
  system: DDMSAA
  module: security
  version: 1.0
components:
  PasswordHasher:
    contract: "BCrypt hash/verify only"
    forbidden: [plaintext_password, reversible_encryption]
  SessionService:
    contract: "Generate high-entropy token, persist only token hash, revoke on logout/disable/password change"
    cookie: { name: DDMSAA_SESSION, httpOnly: true, secure: true, sameSite: Lax, maxAgeHours: 8 }
  CsrfGuard:
    contract: "Require X-CSRF-Token for POST/PUT/DELETE after session authentication"
  LoginLockService:
    contract: "Lock account for 30 minutes after five consecutive failures; generic failure message"
  AccessScopeResolver:
    contract:
      ADMIN: "all records"
      EMPLOYEE: "active employee_customer_assignments only"
      CUSTOMER: "own customer_id; read-only"
  FileSecurity:
    contract: "Validate extension/MIME/size, scan before download, authorize every download"
audit_events:
  required: [LOGIN_SUCCESS, LOGIN_FAILURE, ORDER_CREATE, ORDER_SUBMIT, ORDER_APPROVE, ORDER_RETURN, ORDER_CANCEL, ATTACHMENT_UPLOAD, ATTACHMENT_DOWNLOAD, EXPORT_CREATE, USER_UPDATE]
excluded: ["email-link authentication", "SMS authentication", "JWT refresh token"]
