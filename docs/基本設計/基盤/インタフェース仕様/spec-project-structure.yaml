# ============================================================
# リソースファイル一覧
# ============================================================
resources:
  common:
    - path: "src/main/resources/messages/common-messages.yaml"
      description: "メッセージカタログ正本。各サービスは依存で classpath 共有し重複コピーしない"

  infrastructure:
    - path: "src/main/resources/db/migration/"
      description: "Flyway マイグレーション SQL（V<n>__*.sql / R__*.sql）。Flyway が classpath:db/migration を走査し auth/core 起動時に適用。SQL 内容の正本は データベース（DB チーム）、本モジュールは配置先のみ。命名は 開発規約/spec-flyway-migration-rule.md。初期移行データ＝V1、baseline-version=0（schema 構築は別機構＝版管理対象外）"

  api-gateway:
    - path: "src/main/resources/application.yml"
      port: 8080
      key_settings:
        - "app.jwt.secret / app.jwt.issuer"
        - "app.cors.allowed-origins"
        - "app.services.auth.base-url: http://localhost:8081"
        - "app.services.core.base-url: http://localhost:8082"
        - "spring.cloud.gateway.routes"

  auth-service:
    - path: "src/main/resources/application.yml"
      port: 8081
      key_settings:
        - "app.jwt.secret / app.jwt.issuer / app.jwt.expiration-seconds: 3600"
        - "app.auth.magic-link.ttl-seconds: 3600"
        - "app.auth.magic-link.base-url: http://localhost:3000/auth/verify"
        - "app.auth.mail-from: no-reply@ddmsaa.local"
        - "app.auth.login-lockout-seconds: 1800（汎用 AuthStateStore の予約値。DDMSAA の auth-service は失敗ロックを使用しない）"
        - "app.auth.max-login-failure-count: 5（同上）"
        - "spring.datasource.*"
        - "spring.data.redis.*"
        - "spring.mail.*"
    - path: "src/main/resources/mapper/UserAuthMapper.xml"

  business-service-core:
    - path: "src/main/resources/application.yml"
      port: 8082
      key_settings:
        - "app.jwt.secret / app.jwt.issuer"
        - "app.crypto.aes-key"
        - "app.file.storage-type: ${FILE_STORAGE_TYPE:local}（既定 local。s3 は S3_* を併せて設定したときだけ）"
        - "app.file.s3.region / bucket / prefix / endpoint / path-style / presign-ttl-seconds（資格情報は既定資格情報チェーン）"
        - "app.scan.type: ${SCAN_TYPE:none}（none / clamd。clamd のとき app.scan.clamd.host / port / timeout-seconds）"
        - "app.mail.from: ${MAIL_FROM:no-reply@ddmsaa.local} と spring.mail.*（業務通知 BAT-01 用。auth-service と同じ MAIL_* を使う）"
        - "app.export.file-expiry-hours: 24（CSV 出力ファイルの有効期限。BR-RPT-002）"
        - "spring.datasource.*"

# ============================================================
# ビルドプラグイン
# ============================================================
build_plugins:
  # 注: Spotless は「生成時専用ツール」であり納品 pom には含めない（code_generation_pipeline 参照）。
  #     よって親 POM に formatter プラグインは宣言しない。
  - module: api-gateway
    plugin: spring-boot-maven-plugin
  - module: auth-service
    plugins:
      - spring-boot-maven-plugin
      - "maven-surefire-plugin（*Test。statelessTestsetReporter=JUnit5Xml30StatelessReporter、usePhrasedTestCaseMethodName=true。開発規約/spec-test-rule.md §7）"
      - "maven-failsafe-plugin（*IT。同上の reporter 設定。integration-test / verify フェーズ）"
  - module: business-service-core
    plugins:
      - spring-boot-maven-plugin
      - "maven-compiler-plugin (annotationProcessorPaths: mapstruct-processor)"
      - "maven-surefire-plugin（*Test。statelessTestsetReporter=JUnit5Xml30StatelessReporter、usePhrasedTestCaseMethodName=true。開発規約/spec-test-rule.md §7）"
      - "maven-failsafe-plugin（*IT。同上の reporter 設定。integration-test / verify フェーズ）"
  - module: infrastructure
    plugin: flyway-maven-plugin
    plugin_note: "独立実行用: mvn -pl infrastructure flyway:migrate。url/user/password は pom properties または -D で注入"
    plugin_configuration_raw: |
      <configuration>
          <url>${flyway.url}</url>
          <user>${flyway.user}</user>
          <password>${flyway.password}</password>
          <locations>filesystem:db/migration</locations>
          <baselineOnMigrate>true</baselineOnMigrate>
          <baselineVersion>0</baselineVersion>
      </configuration>

# ============================================================
# ルートファイル
# ============================================================
root_files:
  - path: ".gitattributes"
    description: "LF 正規化（* text=auto, java/xml/yml/yaml/sql/sh → eol=lf, *.bat → eol=crlf, バイナリ → binary）"
  - path: ".editorconfig"
    description: "root=true, charset=utf-8, end_of_line=lf, indent: java/xml=4, yml/json=2"
  # 注: eclipse-formatter.xml は納品物に含めない。formatter は生成時専用ツールであり、
  #     プロファイル正本は 基本設計/基盤/インタフェース仕様/eclipse-formatter.xml に保持する
  #     （code_generation_pipeline.formatter_step 参照）。

# ============================================================
# 環境変数一覧（機微値・必須）
# ============================================================
env_vars:
  - { key: JWT_SECRET,               required: true,  services: [api-gateway, auth-service, business-service-core] }
  - { key: JWT_ISSUER,               required: false, default: ddmsaa,   services: [api-gateway, auth-service, business-service-core] }
  - { key: JWT_EXPIRATION_SECONDS,   required: false, default: "3600",  services: [auth-service, business-service-core] }
  - { key: MAGIC_LINK_TTL_SECONDS,   required: false, default: "3600",  services: [auth-service] }
  - { key: MAGIC_LINK_BASE_URL,      required: false, default: "http://localhost:3000/auth/verify", services: [auth-service] }
  - { key: MAIL_FROM,                required: false, default: "no-reply@ddmsaa.local", services: [auth-service] }
  - { key: CORS_ALLOWED_ORIGINS,     required: false, default: "http://localhost:3000", services: [api-gateway] }
  - { key: AUTH_SERVICE_URI,         required: false, default: "http://localhost:8081", services: [api-gateway, business-service-core] }
  - { key: CORE_SERVICE_URI,         required: false, default: "http://localhost:8082", services: [api-gateway] }
  - { key: AES_KEY,                  required: true,  services: [business-service-core] }
  - { key: "S3_REGION",             required: false, default: "ap-northeast-1", services: [business-service-core] }
  - { key: "S3_BUCKET",             required: false, default: ddmsaa,   services: [business-service-core] }
  - { key: "S3_PREFIX",             required: false, services: [business-service-core] }
  - { key: "S3_ENDPOINT",           required: false, services: [business-service-core] }   # ローカル開発用 MinIO（S3 互換）接続時のみ
  - { key: "S3_PATH_STYLE",         required: false, default: "false", services: [business-service-core] }
  - { key: "S3_PRESIGN_TTL_SECONDS", required: false, default: "300", services: [business-service-core] }
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY は SDK 既定資格情報チェーンの標準変数（アプリ独自項目ではない）。ローカル開発の MinIO 接続時のみ設定し、AWS 上ではタスクロール等を使う
  # --- 接続系（application.yml spec ＝ spec-09-resource-file.yaml と整合。auth は DB_*/REDIS_*/MAIL_*、core は SPRING_DATASOURCE_*） ---
  - { key: DB_USERNAME,              required: false, default: ddmsaa,   services: [auth-service] }   # auth datasource url は固定リテラル、username/password のみ env
  - { key: DB_PASSWORD,              required: true,  services: [auth-service] }
  - { key: REDIS_HOST,               required: false, default: localhost, services: [auth-service] }
  - { key: REDIS_PORT,               required: false, default: "6379",  services: [auth-service] }
  - { key: REDIS_PASSWORD,           required: false, default: "",       services: [auth-service] }
  - { key: MAIL_HOST,                required: false, default: localhost, services: [auth-service] }
  - { key: MAIL_PORT,                required: false, default: "587",    services: [auth-service] }
  - { key: MAIL_USERNAME,            required: false, default: "",       services: [auth-service] }
  - { key: MAIL_PASSWORD,            required: false, default: "",       services: [auth-service] }
  - { key: SPRING_DATASOURCE_URL,      required: true,  services: [business-service-core] }
  - { key: SPRING_DATASOURCE_USERNAME, required: true,  services: [business-service-core] }
  - { key: SPRING_DATASOURCE_PASSWORD, required: true,  services: [business-service-core] }
# 注: 接続系 env 命名は auth=DB_*/REDIS_*、core=SPRING_DATASOURCE_* と不統一（原本 ddmsaa-backend に準拠＝保持）。将来統一する場合は application.yml spec と同時に変更すること。

# ============================================================
# Javadoc / 注釈ポリシー（方針(B)＝Javadoc 本文を spec に pin＝決定論対象 scope B）
# ------------------------------------------------------------
# 方針(B): Javadoc 本文は各 spec の `javadoc` フィールド（型レベル）および
#          method/constructor の `javadoc` フィールド（メソッドレベル）を【逐語】使用する。
#          生成器は文言を創作しない。`javadoc` フィールドが無い要素には Javadoc を付けない（省略裁量を排除）。
#          → Javadoc 本文も決定論対象（scope B）となり、生成のたびに byte 一致する。
#   旧 `javadoc: none` / `javadoc_policy: none` マーカーは本方針で無効（実 `javadoc` フィールドが正本）。
#   正本: 生成要件＝開発規約 spec-backend-coding-rule §11.1、決定論＝基本設計 アーキテクチャ §10.4。
# ============================================================
documentation_policy:
  javadoc:
    language: 日本語
    determinism_scope: B   # 方針(B): Javadoc 本文も決定論対象。spec の javadoc フィールドを逐語使用＝byte 一致
    source_of_text: "各 spec の `javadoc` フィールド（型レベル）/ method・constructor の `javadoc` フィールド（メソッドレベル）を逐語出力。生成器は創作・補完しない。"
    coverage:
      - "型レベル: すべての public 型（class/interface/record/enum）は `javadoc` フィールドを持ち、その本文を逐語出力する。"
      - "メソッドレベル: method/constructor は `javadoc` フィールドを持つもののみ Javadoc を出力（@param/@return/@throws も同フィールド内に逐語記載）。`javadoc` の無い要素には Javadoc を付けない。"
    spec_vs_convention: >-
      yaml に `javadoc` フィールドがあればそれを逐語使用する。`javadoc` フィールドの無い要素は、
      開発規約/spec-backend-coding-rule.md §11.1 に従って日本語 Javadoc を記述する（規約が yaml より優先）。
    no_discretion: "「trivial だから省略」等の生成器裁量を禁止。Javadoc の出力可否と文言は `javadoc` フィールドのみで決まる（決定論）。"
    prohibitions:
      - "spec に無い Javadoc を生成器が創作することを禁止。"
      - "情報量のない placeholder 注釈を禁止。"
    comment_language: "注釈言語は日本語。"
  pom_conventions_ref: "POM メタデータ（<name>/<description>/<relativePath>/properties 等）の固定は本ファイルの pom_conventions を参照（決定論 scope B）。"

# ============================================================
# POM 規約（pom.xml メタデータの固定＝決定論 scope B）
# 座標/継承/依存/scope/plugin は dependencies / dependency_versions / dependency_management / build_plugins が正本。
# 本節は生成器ごとに揺れた「任意メタ要素」を固定する。値は正本 ddmsaa-backend に一致。
# ============================================================
pom_conventions:
  xml_header: |
    <?xml version="1.0" encoding="UTF-8"?>
    <project xmlns="http://maven.apache.org/POM/4.0.0"
             xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
             xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                                 https://maven.apache.org/xsd/maven-4.0.0.xsd">
  name_tag: "全 pom に <name> を含める（値 = artifactId）"
  description_tag: "全 pom に <description> を含める（下記固定文言）"
  descriptions:
    ddmsaa-platform: "DDMSAA 基盤プラットフォーム親 POM"
    common: "横断共通 jar"
    infrastructure: "DB/Redis/JWT/ストレージ/RestClient 横断基盤 jar"
    api-gateway: "Spring Cloud Gateway (WebFlux)"
    auth-service: "パスワードレス Magic Link 認証・JWT 発行"
    business-service-core: "業務コア機能"
  parent_relativePath:
    root: "<relativePath/>（空。spring-boot-starter-parent をリポジトリ解決）"
    children: "<relativePath>../pom.xml</relativePath>（明記）"
  root_properties: "java.version=21 / maven.compiler.release=21 / project.build.sourceEncoding=UTF-8 / spring-cloud.version / dependency_versions の各 *.version（この順）"
  child_pom: "子 pom は groupId/version を書かず親継承。<artifactId>/<packaging>(jar)/<name>/<description> を明記。内部依存(common/infrastructure)は version 省略（dependencyManagement 解決）。"
  child_pom_element_spacing: "子 pom の <artifactId>/<packaging>/<name>/<description> はこの順・要素間に空行なし（隣接記述）"
  dependency_entry_spacing: "<dependencyManagement> および <dependencies> 内の各 <dependency> エントリ間に空行なし"

# ============================================================
# spec / リソース spec インデックス（基盤）
# ============================================================
class_spec_index:
  # ---- インタフェース仕様/（テンプレート × バインディング 同時生成。基本設計 00-05 と兄弟関係） ----
  - { file: spec-01-auth.yaml,            scope: "auth-service（AuthController/AuthService(Impl)/dto/mapper/SecurityConfig/AuthApplication）" }
  - { file: spec-02-authorization.yaml,            scope: "infrastructure.config/gateway.config（SecurityConfig×2）" }
  - { file: spec-03-exception-handler.yaml,         scope: "common.exception（GlobalExceptionHandler/3 例外型）" }
  - { file: spec-04-unified-response.yaml,        scope: "common.response（Result/PageResult/ErrorResponse/FieldError）" }
  - { file: spec-05-trace-message.yaml,    scope: "common.web.filter.TraceIdFilter / common.message（MessageCatalog/YamlMessageCatalog）/ common.security（FieldEncryptor/DataMaskUtil/MaskingService）" }
  - { file: spec-06-gateway.yaml,             scope: "api-gateway（filter/error/config/GatewayApplication）" }
  - { file: spec-07-infrastructure.yaml,   scope: "infrastructure（auth/storage/rest）" }
  - { file: spec-08-security-util.yaml, scope: "infrastructure.jwt（JwtUtil/JwtAuthenticationFilter/UserContext）/ infrastructure.auth.AuthStateStore" }
  - { file: spec-09-resource-file.yaml,       scope: "application.yml ×3 / UserAuthMapper.xml / メッセージカタログ配置" }
  - { file: spec-10-business-core.yaml,   scope: "business-service-core（BusinessServiceCoreApplication/PingController/SecurityConfig）" }
  - { file: spec-11-log-config.yaml,            scope: "logback-spring.xml ×3（実行モジュール）" }

# ============================================================
# 追加リソース: logback-spring.xml（インタフェース仕様/spec-11-log-config.yaml が正本）
# ============================================================
logback_resources:
  api-gateway:
    - { path: "src/main/resources/logback-spring.xml", spec: spec-11-log-config.yaml }
  auth-service:
    - { path: "src/main/resources/logback-spring.xml", spec: spec-11-log-config.yaml }
  business-service-core:
    - { path: "src/main/resources/logback-spring.xml", spec: spec-11-log-config.yaml }

# ============================================================
# テスト生成（本体コードは 01_UTSpec/ 配下が正本）
# ------------------------------------------------------------
# 要否は基本設計 アーキテクチャ §10.3 のテスト導出（T1/T2 必須・T3/T4 不要）で決まる。命名/フレームワーク/データ規約も同節。
# source_files.<module>.test に列挙したクラスのコード本体は 01_UTSpec/ 配下を正本とする。
# ============================================================
test_generation:
  derivation: "基本設計 アーキテクチャ §10.3（T1/T2 必須・JUnit5+Mockito+AssertJ、日本語 @DisplayName、固定テストデータ、鍵は Base64(new byte[32])）"
  note: >
    テスト spec は実装 spec（インタフェース仕様/spec_*.yaml）から派生する。
    テスト生成の規約は 開発規約/spec-backend-scaffold-rule.md §1 を参照。
