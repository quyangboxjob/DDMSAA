# ============================================================
# プロジェクト全体構造
# groupId: com.example.ddmsaa
# artifactId: ddmsaa-platform (親 POM)
# version: 0.1.0
# Spring Boot: 3.5.13 / Java: 21
# ============================================================

project:
  groupId: com.example.ddmsaa
  artifactId: ddmsaa-platform
  version: 0.1.0
  packaging: pom
  parent: "org.springframework.boot:spring-boot-starter-parent:3.5.13"
  java_version: "21"
  spring_cloud_version: "2025.0.2"

# ============================================================
# BOM 外ライブラリの版数 pin（親 POM の <properties>＝dependencyManagement で使用）
# 決定論対象（scope B）。これらは Spring Boot BOM に含まれない/上書きが必要な座標。
# プロパティキー名も固定（生成のたびに揺らさない）。Spring Boot BOM 管理のものは pin しない。
# 注: 版数未固定だと生成器ごとに別版を選び決定論が崩れる（実測: jjwt・pagehelper で生成ごとに別版が選ばれた）。
# ============================================================
dependency_versions:
  jjwt.version: "0.13.0"             # io.jsonwebtoken jjwt-api / jjwt-impl / jjwt-jackson
  mybatis-starter.version: "3.0.4"   # mybatis-spring-boot-starter
  pagehelper.version: "2.1.1"        # pagehelper-spring-boot-starter（MyBatis 3.5.19 同梱）
  mapstruct.version: "1.6.3"         # org.mapstruct mapstruct + mapstruct-processor
  aws-sdk.version: "2.57.2"         # software.amazon.awssdk:bom（AWS SDK for Java v2。s3 は BOM 管理で版数を子に書かない）
  poi.version: "5.4.1"               # org.apache.poi poi-ooxml（BOM 外＝要 pin）。xlsx 帳票出力用
  pdfbox.version: "3.0.3"            # org.apache.pdfbox pdfbox（BOM 外＝要 pin）。注文書 PDF（日本語は IPAex ゴシックを埋め込む）
  tika.version: "2.9.2"              # org.apache.tika tika-core（BOM 外＝要 pin）。添付ファイルの MIME 検出
  # flyway は Spring Boot BOM 管理＝明示 pin しない（flyway-core / flyway-database-postgresql）
  # postgresql は BOM 管理（runtime）＝明示 pin しない
  # 注: Spotless / Eclipse JDT formatter の版数は「生成時ツール」の pin であり納品 pom の property ではない。
  #     code_generation_pipeline.formatter_step に記載（spotless 2.44.5 / eclipse.jdt 4.33）。

# ============================================================
# 親 POM の dependencyManagement（構造を固定＝両生成で同一集合・scope B）
# 版数は dependency_versions / Spring Cloud BOM 由来。子は version を書かない。
# ============================================================
dependency_management:
  bom_import:
    - "org.springframework.cloud:spring-cloud-dependencies:${spring-cloud.version}（scope=import, type=pom）"
    - "software.amazon.awssdk:bom:${aws-sdk.version}（scope=import, type=pom）"
  internal:
    - "com.example.ddmsaa:common:${project.version}"
    - "com.example.ddmsaa:infrastructure:${project.version}"
  bom_external_pins:
    - "io.jsonwebtoken : jjwt-api / jjwt-impl / jjwt-jackson : ${jjwt.version}"
    - "org.mapstruct : mapstruct / mapstruct-processor : ${mapstruct.version}"
    - "org.apache.poi : poi-ooxml : ${poi.version}"
    - "org.apache.pdfbox : pdfbox : ${pdfbox.version}"
    - "org.apache.tika : tika-core : ${tika.version}"
    - "com.github.pagehelper : pagehelper-spring-boot-starter : ${pagehelper.version}"
    - "org.mybatis.spring.boot : mybatis-spring-boot-starter : ${mybatis-starter.version}"

# ============================================================
# コーディング規約（コード生成時の強制事項）
# ============================================================
code_style:
  encoding: UTF-8             # 全ファイル（Java / YAML / XML / SQL / properties）の文字コード。.editorconfig の charset=utf-8 と連動
  # 整形（行長 / 引数折り返し / 空行 / 空白 / import順）は Spotless が正本（layer-2）。
  # 行長 100 = config/eclipse-formatter.xml の lineSplit。
  # 折り返し（第一引数は開き括弧と同行 / 継続 +8）= 同 alignment_* / continuation_indentation。
  # 詳細は code_generation_pipeline を参照。spec 側でこれらを指定しない（formatter が上書き）。
  # signature_raw は「修飾子順・throws 等の意味」のためのみ逐語使用。空白整形は formatter が正規化する。

# ============================================================
# コード生成パイプライン（決定論の担保順序）
# ------------------------------------------------------------
# 整形（layer-2）の責務を Spotless に移譲し、spec の整形記述を不要化するための手順。
# 派生メンバ規約は 開発規約/spec-backend-scaffold-rule.md を参照（getter/setter 等を fields から展開）。
# ============================================================
code_generation_pipeline:
  # ★★★ 必須 ★★★
  # コード生成の最終工程として formatter（Spotless）を必ず適用すること。
  # formatter 未適用のコードは「未完成」とみなす。生成器ごとの整形の揺れ（特にメソッド/
  # コンストラクタ署名の折り返し位置）は formatter 適用前は不一致になるのが正常で、
  # formatter 適用後に初めて決定論（毎回同一）が成立する。実測: spotless 適用で両生成が
  # 58/61 一致（残差は formatter ではなく生成器の未対応＝別問題）。
  formatter_required: true
  steps:
    - "1. 生成: spec（layer-1 = 意味）からコード生成。整形の揺れは許容する（formatter が正規化）。"
    - "2. 派生展開: 開発規約/spec-backend-scaffold-rule.md §1 に従い getter/setter/record/ctor自動代入を展開。"
    - "3. 【必須】整形: コード生成の最後に必ず formatter を適用する（下記 formatter_step）。"
    - "4. 比較: 整形後コード同士で diff（決定論検証は必ず整形後で行う。生コード比較は無意味）。"
  formatter_step:
    mandatory: "生成パイプラインの最終段で必ず実行する。スキップ禁止。"
    nature: >
      formatter は【生成時専用ツール】。納品物（ddmsaa-backend）には Spotless プラグインも
      eclipse-formatter.xml も含めない。生成器が整形を適用し、整形済みコードのみを納品する。
    tool_versions: "spotless-maven-plugin 2.44.5 / eclipse.jdt 4.33（生成時ツールの pin。版数を上げると再整形差分が出るため固定）"
    profile_master: "基本設計/基盤/インタフェース仕様/eclipse-formatter.xml（profile name=ddmsaa。SSOT。納品物にはコピーしない）"
    how_to_run: >
      納品 pom に依存させないため、生成ワークスペースに一時的な整形用 pom（Spotless プラグイン入り、
      eclipse.file=上記 profile_master を指定）を置いて `apply` を実行し、整形後に一時 pom を破棄する。
      恒久ゲートにしたい場合のみ別途プロジェクト pom へ常設する（既定は非常設＝生成時のみ）。
    command_example: "mvn -f <生成時整形用pom> com.diffplug.spotless:spotless-maven-plugin:2.44.5:apply"
    command_note: >
      `mvn spotless:apply`（プレフィックス短縮形）は集約 POM でプレフィックス解決に失敗する場合が
      あるため完全座標で起動すること（実測で確認）。
    normalizes: "行長 / 引数折り返し / 空行 / 空白 / インデント / import順序・未使用import除去 / 行末・終端改行"
    preserves: >
      javadoc は formatter で再整形しない（プロファイルの comment.format_javadoc_comments=false）。
      javadoc 文面・整列は spec（layer-1, SSOT）が正本のため。
    current_limitation: >-
      生成時の Spotless（eclipse.jdt）は download.eclipse.org からの取得が必要。当該サイトが利用できない間は
      手作業で排版（上記 normalizes 相当）を維持し、取得可能になった後に全体へ一括 apply して統一する。
    keep_one_line_value_note: "keep_*_on_one_line の値は never ではなく one_line_never（Eclipse JDT 4.33 で検証）。"
  determinism_layers:
    layer_1_meaning: "spec が SSOT（メンバ集合 / code_body ロジック / javadoc 文面）。曖昧化禁止。"
    layer_2_format:  "Spotless が SSOT（行長 / 空行 / 空白 / import順 / 引数折り返し）。spec で指定しない。"
  note: >
    本パイプライン導入後、code_style の line_length_limit / constructor_and_record_wrapping は
    formatter プロファイル（config/eclipse-formatter.xml）へ移管済み。spec 本文の整形記述は
    冗長（formatter が上書きする）。詳細な記述削減は段階的に実施する。

# ============================================================
# モジュール一覧
# ============================================================
modules:
  - artifactId: common
    packaging: jar
    package_root: com.example.ddmsaa.common
    description: "横断共通 jar。例外・レスポンスラッパ・メッセージ・暗号化・マスキング・TraceIdFilter"
    port: ~

  - artifactId: infrastructure
    packaging: jar
    package_root: com.example.ddmsaa.infrastructure
    description: "DB/Redis/JWT/ストレージ/RestClient 横断基盤 jar"
    port: ~

  - artifactId: api-gateway
    packaging: jar
    package_root: com.example.ddmsaa.gateway
    spring_boot_app: com.example.ddmsaa.gateway.GatewayApplication
    description: "Spring Cloud Gateway (WebFlux)。トレース・JWT 検証・CORS・エラー整形"
    port: 8080

  - artifactId: auth-service
    packaging: jar
    package_root: com.example.ddmsaa.auth
    spring_boot_app: com.example.ddmsaa.auth.AuthApplication
    description: "パスワードレス Magic Link 認証・JWT 発行"
    port: 8081

  - artifactId: business-service-core
    packaging: jar
    package_root: com.example.ddmsaa.core
    spring_boot_app: com.example.ddmsaa.core.BusinessServiceCoreApplication
    description: "業務コア機能"
    port: 8082

# ============================================================
# モジュール別 依存セット（compile スコープ省略、それ以外明示）
# ============================================================
dependencies:
  common:
    - { artifact: "spring-boot-starter-web",        scope: provided }
    - { artifact: "spring-boot-starter-validation", scope: provided }
    - { artifact: "spring-security-core",           scope: provided }
    - { artifact: "spring-tx",                      scope: provided }  # GlobalExceptionHandler が DataAccessException を扱うため（spec-03-exception-handler.yaml）。消費側サービスは mybatis/jdbc 経由で推移提供
    - { artifact: "snakeyaml" }
    - { artifact: "spring-boot-starter-test",       scope: test }

  infrastructure:
    - { artifact: "common",                              scope: internal }
    - { artifact: "spring-boot-starter-web",             scope: provided }
    - { artifact: "spring-boot-starter-security",        scope: provided }
    - { artifact: "spring-boot-starter-data-redis",      scope: provided }
    - { artifact: "mybatis-spring-boot-starter",         scope: provided }  # MetaObjectHandler が org.apache.ibatis.* を使用するため必須
    - { artifact: "jjwt-api" }
    - { artifact: "jjwt-impl",                           scope: runtime }
    - { artifact: "jjwt-jackson",                        scope: runtime }
    - { artifact: "s3" }   # software.amazon.awssdk:s3（版数は AWS SDK BOM）
