    - { artifact: "spring-boot-starter-security" }  # SecurityConfig の @EnableWebFluxSecurity に必要
    - { artifact: "spring-boot-starter-actuator" }
    - { artifact: "jjwt-api" }
    - { artifact: "jjwt-impl",    scope: runtime }
    - { artifact: "jjwt-jackson", scope: runtime }
    - { artifact: "spring-boot-starter-test", scope: test }
    - { artifact: "reactor-test",             scope: test }

  auth-service:
    - { artifact: "common",                          scope: internal }
    - { artifact: "infrastructure",                  scope: internal }
    - { artifact: "spring-boot-starter-web" }
    - { artifact: "spring-boot-starter-security" }
    - { artifact: "spring-boot-starter-validation" }
    - { artifact: "spring-boot-starter-data-redis" }
    - { artifact: "spring-boot-starter-mail" }
    - { artifact: "spring-boot-starter-actuator" }
    - { artifact: "mybatis-spring-boot-starter" }
    - { artifact: "postgresql",   scope: runtime }
    - { artifact: "jjwt-api" }
    - { artifact: "jjwt-impl",    scope: runtime }
    - { artifact: "jjwt-jackson", scope: runtime }
    - { artifact: "spring-boot-starter-test",   scope: test }
    - { artifact: "spring-security-test",        scope: test }
    - { artifact: "testcontainers-junit-jupiter", scope: test }   # org.testcontainers:junit-jupiter（版数は Spring Boot BOM）
    - { artifact: "testcontainers-postgresql",    scope: test }   # org.testcontainers:postgresql

  business-service-core:
    - { artifact: "common",                          scope: internal }
    - { artifact: "infrastructure",                  scope: internal }
    - { artifact: "spring-boot-starter-web" }
    - { artifact: "spring-boot-starter-security" }
    - { artifact: "spring-boot-starter-validation" }
    - { artifact: "spring-boot-starter-actuator" }
    - { artifact: "mybatis-spring-boot-starter" }
    - { artifact: "pagehelper-spring-boot-starter" }
    - { artifact: "postgresql",   scope: runtime }
    - { artifact: "jjwt-api" }
    - { artifact: "jjwt-impl",    scope: runtime }
    - { artifact: "jjwt-jackson", scope: runtime }
    - { artifact: "mapstruct" }
    - { artifact: "s3" }   # software.amazon.awssdk:s3（版数は AWS SDK BOM）
    - { artifact: "spring-boot-starter-mail" }
    - { artifact: "poi-ooxml" }
    - { artifact: "pdfbox" }       # 注文書 PDF（org.apache.pdfbox:pdfbox。版数は pdfbox.version）
