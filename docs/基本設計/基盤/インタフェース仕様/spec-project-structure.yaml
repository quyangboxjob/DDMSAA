meta:
  system: DDMSAA
  version: 1.0
frontend:
  root: frontend
  modules: [auth, users, customers, products, orders, approvals, attachments, reports]
  technology: "React + TypeScript + Vite"
backend:
  root: backend
  technology: "Spring Boot + MyBatis"
  packages:
    - common
    - auth
    - user
    - customer
    - product
    - order
    - approval
    - attachment
    - report
    - infrastructure
  resource_dirs: [db/migration, application]
database:
  migrations: "backend/src/main/resources/db/migration"
documents:
  physical_db: "docs/基本設計/共通/spec-06-db-physical.yaml"
  api: "docs/基本設計/共通/spec-07-api-list.yaml"
  business_rules: "docs/基本設計/共通/spec-08-business-rule-list.md"
constraints:
  - "No separate auth-service is created for initial release."
  - "Authentication uses password + server-side session; mail is notification-only."
