# ============================================================
# spec-09-resource-file.yaml
# 粒度: JDK interface レベル（型定義・メソッドシグネチャのみ）
# 生成元: 基盤テンプレート/spec-backend-foundation-temp.md §4.3.5（メッセージ配置）§7（設定テンプレート）
#         基盤テンプレート/spec-java-springboot-mybatis-temp.yaml
#           build_bindings / config_bindings / stack.migration_*
# 位置づけ: テンプレート × バインディング 同時生成（基本設計 00-05 と兄弟関係）
# ============================================================

# ============================================================
# 1. messages/common-messages.yaml — common モジュール
# ============================================================
resource_files:

  - id: common_messages_ja
    module: common
    package: com.example.ddmsaa.common
    path: common/src/main/resources/messages/common-messages.yaml
    kind: resource_file
    format: yaml
    purpose: >
      メッセージカタログ日本語正本。messageId → 日本語メッセージ文のキー・バリュー YAML。
      バックエンドは messageId のみを返却し、フロントが本カタログで表示文言を解決する。
    structure:
      top_level_key: messages
      entry_schema: "messageId: { category: INFO|WARNING|ERROR, message: String }"
      messageId_format: "基本設計/共通/spec-00-doc-standard-ui.md §3 に従う"
      placeholder_format: "{0}, {1} ...（args 配列順次置換）"
    key_namespaces:
      - prefix: "I"
        category: INFO
        description: 正常完了・案内メッセージ
      - prefix: "W"
        category: WARNING
        description: 注意・確認・ハイライト
      - prefix: "E"
        category: ERROR
        description: エラーメッセージ
    constraints:
      - すべての messageId は本ファイルに存在しなければならない（生成門 G-Msg）
      - 使用していない messageId を参照するコードは生成門により拒否される
      - common jar への依存のみで classpath 共有。ローカルコピー禁止
      - 改行コードは 開発規約/spec-backend-coding-rule.md §12 に従う

  - id: common_messages_zh
    module: common
    package: com.example.ddmsaa.common
    path: common/src/main/resources/messages/common-messages.zh.yaml
    kind: resource_file
    format: yaml
    purpose: メッセージカタログ中国語バリアント。messageId・category は日本語正本と同一。message 文言のみ中国語。
    structure:
      top_level_key: messages
      entry_schema: "messageId: { category: INFO|WARNING|ERROR, message: String }"
      messageId_format: "<CAT><NNNN>（日本語正本と同一採番）"

  - id: common_messages_en
    module: common
    package: com.example.ddmsaa.common
    path: common/src/main/resources/messages/common-messages.en.yaml
    kind: resource_file
    format: yaml
    purpose: メッセージカタログ英語バリアント。messageId・category は日本語正本と同一。message 文言のみ英語。
    structure:
      top_level_key: messages
      entry_schema: "messageId: { category: INFO|WARNING|ERROR, message: String }"
      messageId_format: "<CAT><NNNN>（日本語正本と同一採番）"

# ============================================================
# 2. application.yml テンプレート — 各サービス
# ============================================================

  - id: api_gateway_application_yml
    module: api-gateway
    package: com.example.ddmsaa.gateway
    path: api-gateway/src/main/resources/application.yml
    kind: resource_file
    format: yaml
    purpose: api-gateway の Spring Boot 設定テンプレート。ポート 8080。WebFlux Gateway ルーティング・JWT検証・CORS設定を含む。
    key_namespaces:
      - key: server.port
        type: Integer
        value: 8080
        description: サービスポート
      - key: spring.application.name
        type: String
        value: api-gateway
        description: アプリケーション名
      - key: spring.cloud.gateway.server.webflux.routes
        type: List<RouteDefinition>
        description: >
          Gateway ルート定義リスト。
          id=auth → uri=${app.services.auth.base-url}, predicates=[Path=/api/v1/auth/**];
          id=business-core → uri=${app.services.core.base-url}, predicates=[Path=/api/v1/**]
      - key: app.jwt.secret
        type: String
        env_var: JWT_SECRET
        required: true
        description: JWT 署名秘密鍵（環境変数必須）
      - key: app.jwt.issuer
        type: String
        default: ddmsaa
        description: JWT issuer クレーム値
      - key: app.services.auth.base-url
        type: String
        default: "http://localhost:8081"
        description: auth-service のベース URL
      - key: app.services.core.base-url
        type: String
        default: "http://localhost:8082"
        description: business-service-core のベース URL
      - key: app.cors.allowed-origins
        type: String
        default: "http://localhost:3000"
        description: CORS 許可オリジン（環境変数 CORS_ALLOWED_ORIGINS で上書き可）
      - key: management.endpoints.web.exposure.include
        type: String
        value: health
        description: Actuator 公開エンドポイント
    constraints:
      - api-gateway は infrastructure 非依存のため spring.datasource / spring.flyway を持たない
      - TraceIdFilter は GlobalFilter（WebFlux リアクティブ）として実装

  - id: auth_service_application_yml
    module: auth-service
    package: com.example.ddmsaa.auth
    path: auth-service/src/main/resources/application.yml
    kind: resource_file
    format: yaml
    purpose: auth-service の Spring Boot 設定テンプレート。ポート 8081。DB・Redis・JWT・Magic Link 認証設定を含む。
    key_namespaces:
      - key: server.port
        type: Integer
        value: 8081
        description: サービスポート
      - key: spring.application.name
        type: String
        value: auth-service
        description: アプリケーション名
      - key: spring.datasource.url
        type: String
        description: "PostgreSQL 接続 URL（currentSchema=public 必須）"
      - key: spring.datasource.username
        type: String
        env_var: DB_USERNAME
        description: DB ユーザ名
      - key: spring.datasource.password
        type: String
        env_var: DB_PASSWORD
        description: DB パスワード
      - key: spring.datasource.driver-class-name
        type: String
        value: org.postgresql.Driver
        description: JDBC ドライバクラス名
      - key: spring.flyway.enabled
        type: Boolean
        value: true
        description: Flyway マイグレーション有効化
      - key: spring.flyway.locations
        type: String
        value: "classpath:db/migration"
        description: マイグレーションスクリプト配置パス
      - key: spring.flyway.schemas
        type: String
        value: public
        description: 対象スキーマ
      - key: spring.flyway.default-schema
        type: String
        value: public
        description: デフォルトスキーマ
      - key: spring.flyway.baseline-on-migrate
        type: Boolean
        value: true
        description: 既存 DB を baseline として扱う
      - key: spring.flyway.baseline-version
        type: String
        value: "0"
        description: baseline バージョン番号
      - key: spring.data.redis.host
        type: String
        default: localhost
        env_var: REDIS_HOST
        description: Redis ホスト
      - key: spring.data.redis.port
        type: Integer
        default: 6379
        env_var: REDIS_PORT
        description: Redis ポート
      - key: spring.data.redis.password
        type: String
        env_var: REDIS_PASSWORD
        description: Redis パスワード
      - key: mybatis.configuration.map-underscore-to-camel-case
        type: Boolean
        value: true
        description: snake_case → camelCase 自動変換
      - key: mybatis.mapper-locations
        type: String
        value: "classpath:mapper/*.xml"
        description: MyBatis XML マッパー配置パス（auth-service のみ）
      - key: app.jwt.secret
        type: String
        env_var: JWT_SECRET
        required: true
        description: JWT 署名秘密鍵（環境変数必須）
      - key: app.jwt.issuer
        type: String
        default: ddmsaa
        description: JWT issuer クレーム値
      - key: app.jwt.expiration-seconds
        type: Integer
        default: 3600
        unit: 秒
        description: JWT 有効期限秒数
      - key: app.auth.magic-link.ttl-seconds
        type: Integer
        default: 3600
        unit: 秒
        description: "Magic Link トークン TTL（所有: auth-service）"
      - key: app.auth.max-login-failure-count
        type: Integer
        default: 5
        unit: 回
        description: "ログイン失敗上限回数（所有: auth-service）"
      - key: app.auth.login-lockout-seconds
        type: Integer
        default: 1800
        unit: 秒
        description: "ロックアウト TTL（所有: auth-service）"
      - key: app.auth.magic-link.base-url
        type: String
        default: "http://localhost:3000/auth/verify"
        description: "Magic Link メール本文に埋め込む検証用ベース URL（所有: auth-service）"
      - key: app.auth.mail-from
        type: String
        default: "no-reply@ddmsaa.local"
        description: Magic Link 送信元メールアドレス
      - key: spring.mail.host
        type: String
        env_var: MAIL_HOST
        description: SMTP ホスト。JavaMailSender 構成用。未構成時はメール送信をスキップし warn ログのみ
      - key: spring.mail.port
        type: Integer
        env_var: MAIL_PORT
        default: 587
        description: SMTP ポート
      - key: spring.mail.username
        type: String
        env_var: MAIL_USERNAME
        description: SMTP ユーザ名
      - key: spring.mail.password
        type: String
        env_var: MAIL_PASSWORD
        description: SMTP パスワード
      - key: spring.mail.default-encoding
        type: String
        default: UTF-8
        description: メール既定エンコーディング
      - key: app.cors.allowed-origins
        type: String
        default: "http://localhost:3000"
        env_var: CORS_ALLOWED_ORIGINS
        description: CORS 許可オリジン（infrastructure.SecurityConfig の CorsConfigurationSource 用）
    constraints:
      - spring.datasource.url は currentSchema=public を必ず含める
      - BCrypt / パスワード列 / refresh token は一切使用しない（モード② Magic Link のみ）
      - spring.mail.* は Magic Link 送信に使用。未構成でも起動は継続し送信時に warn ログでスキップする

