      - key: app.file.local.base-dir
        type: String
        default: "${java.io.tmpdir}/ddmsaa-files"
        env_var: FILE_LOCAL_BASE_DIR
        description: "LocalFileStorageService の保存先ディレクトリ（storage-type=local 時）"
      - key: app.file.s3.region
        type: String
        env_var: S3_REGION
        default: "ap-northeast-1"
        description: S3 リージョン
      - key: app.file.s3.bucket
        type: String
        env_var: S3_BUCKET
        default: ddmsaa
        description: S3 バケット名
      - key: app.file.s3.prefix
        type: String
        env_var: S3_PREFIX
        required: false
        description: オブジェクトキー接頭辞（任意）
      - key: app.file.s3.endpoint
        type: String
        env_var: S3_ENDPOINT
        required: false
        description: "S3 互換エンドポイント URL（任意。ローカル開発用 MinIO 接続時のみ指定。例 http://localhost:9000）"
      - key: app.file.s3.path-style
        type: Boolean
        env_var: S3_PATH_STYLE
        default: false
        description: パススタイルアクセス（任意。ローカル開発用 MinIO 接続時は true）
      - key: app.file.s3.presign-ttl-seconds
        type: Integer
        env_var: S3_PRESIGN_TTL_SECONDS
        default: 300
        unit: 秒
        description: 署名付き URL の標準有効期間
      - key: app.export.file-expiry-hours
        type: Integer
        default: 24
        unit: 時間
        description: "CSV 出力ファイルの有効期限（完了から。BR-RPT-002。所有: business-service-core）。旧 app.export.file-expiry-days（7 日）は廃止"
      - key: app.scan.type
        type: Enum
        values: [none, clamd]
        default: none
        env_var: SCAN_TYPE
        description: "ウイルススキャンの方式。none は開発用（スキャンせず SAFE とし warn ログを出す）。clamd は ClamAV の clamd へ TCP（INSTREAM）で依頼する。本番は clamd（所有: business-service-core / BAT-05）"
      - key: app.scan.clamd.host
        type: String
        default: localhost
        env_var: CLAMD_HOST
        description: "clamd のホスト（app.scan.type=clamd のとき）"
      - key: app.scan.clamd.port
        type: Integer
        default: 3310
        env_var: CLAMD_PORT
        description: "clamd の TCP ポート"
      - key: app.scan.clamd.timeout-seconds
        type: Integer
        default: 30
        unit: 秒
        description: "1 ファイルのスキャン待ち時間の上限。超過は PENDING のまま次回に再試行"
      - key: app.mail.from
        type: String
        default: "no-reply@ddmsaa.local"
        env_var: MAIL_FROM
        description: "業務通知メール（BAT-01）の送信元。Magic Link の app.auth.mail-from とは別キー（所有: business-service-core）"
      - key: app.cors.allowed-origins
        type: String
        default: "http://localhost:3000"
        env_var: CORS_ALLOWED_ORIGINS
        description: CORS 許可オリジン（infrastructure.SecurityConfig の CorsConfigurationSource 用）
    constraints:
      - mybatis.mapper-locations は auth-service・business-service-core の両方で必要（classpath:mapper/*.xml）
      - business-service-core は Redis を使用しない（spring.data.redis.* を持たない）
      - app.crypto.aes-key 未設定時は起動時 IllegalStateException（fail-fast）
      - HikariCP 設定は business-service-core のみ（auth-service には不要）

# ============================================================
# 3. db/migration 配置規則 — infrastructure モジュール
# ============================================================

  - id: flyway_migration_scripts
    module: infrastructure
    package: com.example.ddmsaa.infrastructure
    path: infrastructure/src/main/resources/db/migration/
    kind: resource_directory
    purpose: >
      Flyway マイグレーションスクリプト配置ディレクトリ。
      infrastructure モジュールに配置し、auth-service / business-service-core が
      infrastructure への依存を通じて classpath で共有する（同源のため分岐しない）。
    naming_rules:
      versioned:
        pattern: "V{n}__{description}.sql"
        description: >
          バージョン付きマイグレーションスクリプト。
          n = 正の整数（単調増加）、description = スネークケース説明文。
          例: V1__initial_data_migration.sql, V2__add_user_nickname.sql
        examples:
          - V1__initial_data_migration.sql
          - V2__add_users_index.sql
          - V3__add_user_nickname.sql
      repeatable:
        pattern: "R__{description}.sql"
        description: >
          リピータブルマイグレーションスクリプト。
          チェックサム変更時に再実行される。ビュー・関数の再定義等に使用。
        examples:
          - R__refresh_views.sql
    constraints:
      - 初期 schema（採番関数 next_business_id(prefix)・トリガー set_updated_at を含む）は機構A（docker setup）で構築し、構築後の変更と初期移行データを本ディレクトリの Flyway スクリプトで扱う
      - SQL 内容の正本は データベース（SSOT）
      - auth-service は V1 以降のみ適用（baseline-version=0 で既存 DB を認領）
      - UT / 開発サンプルデータは Flyway 管理外（test profile / 手動 psql）
      - api-gateway は infrastructure 非依存のため本ディレクトリを持たない
    flyway_config_shared:
      description: auth-service / business-service-core 共通 spring.flyway 設定
      keys:
        - key: spring.flyway.enabled
          value: true
        - key: spring.flyway.locations
          value: "classpath:db/migration"
        - key: spring.flyway.schemas
          value: public
        - key: spring.flyway.default-schema
          value: public
        - key: spring.flyway.baseline-on-migrate
          value: true
        - key: spring.flyway.baseline-version
          value: "0"

# ============================================================
# 4. logback-spring.xml 配置規則 — 実行モジュール
#    ※ 構造の正本は spec-11-log-config.yaml。本節は配置先のみを定義し、
#      パターン / appender / springProfile / ログレベル / totalSizeCap 等の詳細は
#      11 に一本化する（旧・本節の logging.pattern.level 別表記は廃止）。
# ============================================================

  - id: logback_spring_xml_api_gateway
    module: api-gateway
    package: com.example.ddmsaa.gateway
    path: api-gateway/src/main/resources/logback-spring.xml
    kind: resource_file
    format: xml
    purpose: api-gateway 用 Logback 設定。構造は spec-11-log-config.yaml を正本とする。
    spec_ref: spec-11-log-config.yaml
    constraints:
      - 構造（パターン / appender / springProfile / ログレベル / totalSizeCap）は spec-11-log-config.yaml に完全準拠する
      - MODULE_NAME プロパティに api-gateway を設定する
      - 共有 jar（common / infrastructure）には logback-spring.xml を配置しない

  - id: logback_spring_xml_auth_service
    module: auth-service
    package: com.example.ddmsaa.auth
    path: auth-service/src/main/resources/logback-spring.xml
    kind: resource_file
    format: xml
    purpose: auth-service 用 Logback 設定。構造は spec-11-log-config.yaml を正本とする。
    spec_ref: spec-11-log-config.yaml
    constraints:
      - 構造（パターン / appender / springProfile / ログレベル / totalSizeCap）は spec-11-log-config.yaml に完全準拠する
