meta:
  system: DDMSAA
  version: 1.0
configuration:
  database:
    required: [DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD]
    note: "PostgreSQL 16 connection. Credentials are supplied only by runtime secrets."
  session:
    required: [APP_SESSION_SECRET]
    max_age_hours: 8
    cookie_name: DDMSAA_SESSION
  mail:
    required_when_enabled: [SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM]
    purpose: "approval, return, cancellation, export completion notifications"
  storage:
    required: [OBJECT_STORAGE_ENDPOINT, OBJECT_STORAGE_BUCKET, OBJECT_STORAGE_ACCESS_KEY, OBJECT_STORAGE_SECRET_KEY]
    purpose: "attachments and generated outputs"
  malware_scan:
    required_when_enabled: [MALWARE_SCAN_ENDPOINT]
    fail_closed: true
  export:
    sync_limit_records: 10000
    expiry_hours: 24
rules:
  - "No secret, database password, SMTP password, session secret, or storage key is committed to Git."
  - "Passwords use BCrypt in users.password_hash; raw session values are never stored."
  - "Email is not an authentication mechanism."
