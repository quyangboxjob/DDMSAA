      column: "order_id"
      references: "orders(id)"
    - name: "fk_ord_atts_att_vis_codes"
      column: "visibility"
      references: "attachment_visibility_codes(attachment_visibility_code)"
    - name: "fk_ord_atts_scan_sts_codes"
      column: "scan_status"
      references: "scan_status_codes(scan_status_code)"
  checks:
    - name: "chk_ord_atts_file_size"
      expression: "file_size > 0 AND file_size <= 10485760"

