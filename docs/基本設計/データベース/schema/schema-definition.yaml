# ============================================= 顧客
customers:
  description: "顧客マスタ"
  id_generation: "next_business_id('CS', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('CS', 8)"
      comment: "顧客ID（CS+8桁を採番）"
    customer_code:
      type: VARCHAR(30)
      nullable: false
      comment: "顧客コード（未削除行で一意）"
    customer_name:
      type: VARCHAR(200)
      nullable: false
      comment: "顧客名"
    email:
      type: VARCHAR(255)
      nullable: true
      comment: "メールアドレス"
    phone_number:
      type: VARCHAR(50)
      nullable: true
      comment: "電話番号"
    status:
      type: INT
      nullable: false
      comment: "状態（参照: 顧客状態（T07-3：1=ACTIVE, 2=INACTIVE）。） FK→customer_status_codes.customer_status_code"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "uq_customers_customer_code"
      columns: ["customer_code"]
      type: "UNIQUE"
      where: "deleted_at IS NULL"
    - name: "idx_customers_status"
      columns: ["status"]
      type: "BTREE"
  foreign_keys:
    - name: "fk_customers_cus_sts_codes"
      column: "status"
      references: "customer_status_codes(customer_status_code)"

