# ============================================= 承認ルール
approval_rules:
  description: "承認経路。初版は 0〜上限なし・1 段・ADMIN の 1 行のみ（BR-APR-001）。承認者は特定しない（有効な ADMIN のうち申請者以外）"
  id_generation: "next_business_id('AR', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('AR', 8)"
      comment: "承認ルールID（AR+8桁を採番）"
    min_amount:
      type: NUMERIC(15,2)
      nullable: false
      default: "0"
      comment: "金額下限"
    max_amount:
      type: NUMERIC(15,2)
      nullable: true
      comment: "金額上限（NULL=上限なし）"
    approval_step:
      type: NUMERIC
      nullable: false
      default: "1"
      comment: "承認段階"
    approver_role:
      type: INT
      nullable: false
      comment: "承認者ロール（参照: ロール（T07-1：1=ADMIN, 2=EMPLOYEE, 3=CUSTOMER）。初版は 1=ADMIN 固定（chk_apr_rules_approver_role）） FK→user_role_codes.user_role_code"
    is_active:
      type: BOOLEAN
      nullable: false
      default: "TRUE"
      comment: "有効フラグ"
    effective_from_date:
      type: DATE
      nullable: false
      comment: "適用開始日"
    effective_to_date:
      type: DATE
      nullable: true
      comment: "適用終了日"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "idx_apr_rules_active_eff_from"
      columns: ["is_active", "effective_from_date"]
      type: "BTREE"
    - name: "idx_apr_rules_approver_role"
      columns: ["approver_role"]
      type: "BTREE"
  foreign_keys:
    - name: "fk_apr_rules_user_role_codes"
      column: "approver_role"
      references: "user_role_codes(user_role_code)"
  checks:
    - name: "chk_apr_rules_approver_role"
      expression: "approver_role = 1"
    - name: "chk_approval_rules_max_amount"
      expression: "max_amount IS NULL OR max_amount >= min_amount"
    - name: "chk_apr_rules_eff_to_date"
      expression: "effective_to_date IS NULL OR effective_to_date >= effective_from_date"
  seed:
    - { min_amount: 0, max_amount: null, approval_step: 1, approver_role: 1, is_active: true, effective_from_date: "2026-01-01" }

