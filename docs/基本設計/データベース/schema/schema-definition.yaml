# =============================================================================
# データベーススキーマ定義 - DDMSAA
# =============================================================================
# 本ファイルは spec-06-db-physical.yaml と同期する機械可読のスキーマ定義（DDL 生成の中間層）。
# 構造変更は先に spec-06-db-physical.yaml / spec-06-db-physical-ui.md を改訂し、その後に本ファイルへ同期する。
# 両者が矛盾する場合は spec-06-db-physical.yaml を正とし、本ファイルを修正する。
#
# 適用範囲:
#   - PostgreSQL 16（データベース名: ddmsaa / schema: public）
#   - 文字セット: UTF8 / タイムゾーン: システムタイムゾーン（spec-01-system-architecture-ui.md）
#
# 規約: テーブル名・主キー・共通列・列挙・時刻・制約/索引名は
#   開発規約/spec-naming-rule.md および 開発規約/spec-database-rule.md に従う。
# =============================================================================
#
# 生成元: 共通/spec-06-db-physical.yaml（DDMSAA 新基線。旧示例 users/departments は廃止）
# 並び順: 外部キーの依存順（参照先を先に定義）

# ============================================= ロールコード
user_role_codes:
  description: "ロール列挙（T07-1）のコード表"
  soft_delete: false   # no soft delete: コードテーブル
  columns:
    user_role_code:
      type: INT
      primary_key: true
      comment: "ロールコード（T07 の属性コード。採番しない）"
    user_role_name:
      type: VARCHAR(50)
      nullable: false
      comment: "ロール名（T07 の英語名（API 値））"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
  indexes:
    - name: "uq_user_role_codes_name"
      columns: ["user_role_name"]
      type: "UNIQUE"
  seed:   # T07-1
    - { user_role_code: 1, user_role_name: "ADMIN" }
    - { user_role_code: 2, user_role_name: "EMPLOYEE" }
    - { user_role_code: 3, user_role_name: "CUSTOMER" }

