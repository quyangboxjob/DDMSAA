notification_logs:
  description: "業務メール通知のアウトボックスと送信履歴（Magic Link は auth-service が送信し、ここには記録しない）"
  id_generation: "next_business_id('NL', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('NL', 8)"
      comment: "通知ID（NL+8桁を採番）"
    notification_event:
      type: INT
      nullable: false
      comment: "通知イベント（参照: 通知イベント（T07-11：1=ORDER_SUBMITTED, 2=ORDER_APPROVED, 3=ORDER_RETURNED, 4=ORDER_CANCELLED, 5=EXPORT_COMPLETED）。） FK→notification_event_codes.notification_event_code"
    order_id:
      type: VARCHAR(10)
      nullable: true
      comment: "注文ID FK→orders.id"
    recipient_email:
      type: VARCHAR(255)
      nullable: false
      comment: "宛先メール"
    status:
      type: INT
      nullable: false
      comment: "状態（参照: 通知状態（T07-12：1=QUEUED, 2=SENDING, 3=SENT, 4=FAILED）。再試行待ちは QUEUED のまま、最終失敗だけ FAILED） FK→notification_status_codes.notification_status_code"
    export_job_id:
      type: VARCHAR(10)
      nullable: true
      comment: "出力ジョブID（出力完了通知（EXPORT_COMPLETED）の対象ジョブ。それ以外は NULL） FK→export_jobs.id"
    attempt_count:
      type: NUMERIC
      nullable: false
      default: "0"
      comment: "試行回数（送信を試みた回数（初回を含む。最大 4 回＝初回＋再試行 3 回。手動再送で 0 に戻す。BR-NTF-002））"
    next_attempt_at:
      type: TIMESTAMPTZ
      nullable: true
      comment: "次回送信日時（次回送信予定日時。QUEUED のとき送信ワーカーが `next_attempt_at <= 現在` の行を処理する（BR-NTF-002））"
    error_message:
      type: TEXT
      nullable: true
      comment: "エラー内容"
    sent_at:
      type: TIMESTAMPTZ
      nullable: true
      comment: "送信日時"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "idx_ntf_logs_status_created"
      columns: ["status", "created_at"]
      type: "BTREE"
    - name: "idx_ntf_logs_status_next_try"
      columns: ["status", "next_attempt_at"]
      type: "BTREE"
    - name: "idx_ntf_logs_export_job_id"
      columns: ["export_job_id"]
      type: "BTREE"
    - name: "idx_notification_logs_order_id"
      columns: ["order_id"]
      type: "BTREE"
    - name: "idx_ntf_logs_ntf_event"
      columns: ["notification_event"]
      type: "BTREE"
  foreign_keys:
    - name: "fk_ntf_logs_ntf_evt_codes"
      column: "notification_event"
      references: "notification_event_codes(notification_event_code)"
    - name: "fk_notification_logs_orders"
      column: "order_id"
      references: "orders(id)"
    - name: "fk_ntf_logs_export_jobs"
      column: "export_job_id"
      references: "export_jobs(id)"
    - name: "fk_ntf_logs_ntf_sts_codes"
