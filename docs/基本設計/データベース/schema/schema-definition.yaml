users:
  description: "利用者。パスワードは保持しない（Magic Link 認証）"
  id_generation: "アプリケーション層で next_business_id(prefix, 4)。prefix=A/E/C（ロール別）。DEFAULT なし"
  columns:
    user_id:
      type: VARCHAR(10)
      primary_key: true
      comment: "ユーザID（業務キー。ロールに応じた prefix（A=ADMIN / E=EMPLOYEE / C=CUSTOMER）+4桁をアプリケーション層で採番。DEFAULT なし）"
    user_name:
      type: VARCHAR(100)
      nullable: false
      comment: "表示名"
    role:
      type: INT
      nullable: false
      comment: "ロール（参照: ロール（T07-1：1=ADMIN, 2=EMPLOYEE, 3=CUSTOMER）。） FK→user_role_codes.user_role_code"
    status:
      type: INT
      nullable: false
      comment: "状態（参照: 利用者状態（T07-2：1=ACTIVE, 2=DISABLED）。） FK→user_status_codes.user_status_code"
    customer_id:
      type: VARCHAR(10)
      nullable: true
      comment: "顧客ID（CUSTOMER は必須、ADMIN / EMPLOYEE は NULL（chk_users_customer_id）） FK→customers.id"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "idx_users_customer_id"
      columns: ["customer_id"]
      type: "BTREE"
    - name: "idx_users_role_status"
      columns: ["role", "status"]
      type: "BTREE"
    - name: "idx_users_status"
      columns: ["status"]
      type: "BTREE"
  foreign_keys:
    - name: "fk_users_user_role_codes"
      column: "role"
      references: "user_role_codes(user_role_code)"
    - name: "fk_users_user_status_codes"
      column: "status"
      references: "user_status_codes(user_status_code)"
    - name: "fk_users_customers"
      column: "customer_id"
      references: "customers(id)"
  checks:
    - name: "chk_users_customer_id"
      expression: "(role = 3) = (customer_id IS NOT NULL)"

# ============================================= ユーザ連絡先
user_contacts:
  description: "Magic Link・通知の送信先メール（users と 1:1）。users と同時に作成し、行は更新のみで削除しない"
  soft_delete: false   # no soft delete: users の 1:1 子（その場で更新）
  columns:
    user_id:
      type: VARCHAR(10)
      primary_key: true
      comment: "ユーザID（共有主キー（§4.1-SHARED）） FK→users.user_id"
    email:
      type: VARCHAR(255)
      nullable: false
      comment: "メールアドレス（全行で一意）"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
  indexes:
    - name: "uq_user_contacts_email"
      columns: ["email"]
      type: "UNIQUE"
  foreign_keys:
    - name: "fk_user_contacts_users"
      column: "user_id"
      references: "users(user_id)"

# ============================================= システムロック
system_locks:
  description: "ADMIN による利用者ロック（users と 1:0..1）。ログイン可否判定に使用。解除は lock_started_at を NULL に更新し、行は削除しない"
  soft_delete: false   # no soft delete: users の 1:0..1 子（その場で更新）
  columns:
    user_id:
      type: VARCHAR(10)
      primary_key: true
      comment: "ユーザID（共有主キー（§4.1-SHARED）） FK→users.user_id"
    lock_started_at:
      type: TIMESTAMPTZ
      nullable: true
      comment: "ロック開始日時（NULL=ロックなし。ロック操作時の現在時刻を設定する（未来時刻は設定しない））"
    lock_reason:
      type: VARCHAR(500)
      nullable: true
      comment: "ロック理由"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
  foreign_keys:
    - name: "fk_system_locks_users"
      column: "user_id"
      references: "users(user_id)"

# ============================================= 顧客連絡先
customer_contacts:
  description: "顧客の連絡先・通知先"
  id_generation: "next_business_id('CC', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('CC', 8)"
      comment: "顧客連絡先ID（CC+8桁を採番）"
    customer_id:
      type: VARCHAR(10)
      nullable: false
      comment: "顧客ID FK→customers.id"
    contact_name:
      type: VARCHAR(100)
      nullable: false
      comment: "連絡先名"
    email:
      type: VARCHAR(255)
      nullable: false
      comment: "メールアドレス"
    is_notification_recipient:
      type: BOOLEAN
      nullable: false
      default: "FALSE"
      comment: "通知先フラグ"
    is_active:
      type: BOOLEAN
      nullable: false
      default: "TRUE"
      comment: "有効フラグ"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "idx_cus_cnt_cus_id_is_active"
      columns: ["customer_id", "is_active"]
      type: "BTREE"
  foreign_keys:
    - name: "fk_customer_contacts_customers"
      column: "customer_id"
      references: "customers(id)"

# ============================================= 担当割当
customer_assignments:
  description: "EMPLOYEE と担当顧客の割当（属性を持つため業務エンティティとして扱う）"
  id_generation: "next_business_id('AS', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('AS', 8)"
      comment: "担当割当ID（AS+8桁を採番）"
    customer_id:
      type: VARCHAR(10)
      nullable: false
      comment: "顧客ID FK→customers.id"
    user_id:
      type: VARCHAR(10)
      nullable: false
      comment: "ユーザID（担当 EMPLOYEE） FK→users.user_id"
    is_active:
      type: BOOLEAN
      nullable: false
      default: "TRUE"
      comment: "有効フラグ（解除は FALSE にする（論理削除しない）。同じ顧客・社員を再割当するときは同じ行を TRUE に戻し、割当日を当日にする）"
    assigned_date:
      type: DATE
      nullable: false
      default: "CURRENT_DATE"
      comment: "割当日"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "uq_cus_asg_cus_id_user_id"
      columns: ["customer_id", "user_id"]
      type: "UNIQUE"
      where: "deleted_at IS NULL"
    - name: "idx_cus_asg_user_id_is_active"
      columns: ["user_id", "is_active"]
      type: "BTREE"
  foreign_keys:
    - name: "fk_cus_asg_customers"
      column: "customer_id"
      references: "customers(id)"
    - name: "fk_customer_assignments_users"
      column: "user_id"
      references: "users(user_id)"

# ============================================= 商品
products:
  description: "商品マスタ"
  id_generation: "next_business_id('PR', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('PR', 8)"
      comment: "商品ID（PR+8桁を採番）"
    product_code:
      type: VARCHAR(50)
      nullable: false
      comment: "商品コード（未削除行で一意）"
    product_name:
      type: VARCHAR(200)
      nullable: false
      comment: "商品名"
    product_category:
      type: VARCHAR(100)
      nullable: true
      comment: "商品カテゴリ"
    standard_unit_price:
      type: NUMERIC(15,2)
      nullable: false
      default: "0"
      comment: "標準単価（0 以上（chk_products_std_unit_price））"
    tax_category:
      type: INT
      nullable: false
      comment: "税区分（参照: 税区分（T07-5：1=STANDARD, 2=REDUCED, 3=EXEMPT）。） FK→tax_category_codes.tax_category_code"
    status:
      type: INT
      nullable: false
      comment: "状態（参照: 商品状態（T07-4：1=ACTIVE, 2=INACTIVE）。） FK→product_status_codes.product_status_code"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "uq_products_product_code"
      columns: ["product_code"]
      type: "UNIQUE"
      where: "deleted_at IS NULL"
    - name: "idx_products_tax_category"
      columns: ["tax_category"]
      type: "BTREE"
    - name: "idx_products_status"
      columns: ["status"]
      type: "BTREE"
  foreign_keys:
    - name: "fk_products_tax_category_codes"
      column: "tax_category"
      references: "tax_category_codes(tax_category_code)"
    - name: "fk_products_prd_sts_codes"
      column: "status"
      references: "product_status_codes(product_status_code)"
  checks:
    - name: "chk_products_std_unit_price"
      expression: "standard_unit_price >= 0"

# ============================================= 税率
tax_rates:
  description: "税区分ごとの税率（§4.1-NATURAL）。注文時に明細へ複写する"
  columns:
    tax_category:
      type: INT
      primary_key: true
      comment: "税区分（参照: 税区分（T07-5：1=STANDARD, 2=REDUCED, 3=EXEMPT）。自然キー主キー） FK→tax_category_codes.tax_category_code"
    tax_rate:
      type: NUMERIC(5,2)
      nullable: false
      default: "0"
      comment: "税率（0.00〜100.00（chk_tax_rates_tax_rate））"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  foreign_keys:
    - name: "fk_tax_rates_tax_cat_codes"
      column: "tax_category"
      references: "tax_category_codes(tax_category_code)"
  checks:
    - name: "chk_tax_rates_tax_rate"
      expression: "tax_rate BETWEEN 0 AND 100"
  seed:
    - { tax_category: 1, tax_rate: 10.00 }
    - { tax_category: 2, tax_rate: 8.00 }
    - { tax_category: 3, tax_rate: 0.00 }

# ============================================= 注文
orders:
  description: "注文ヘッダ。注文番号は id とする"
  id_generation: "next_business_id('OD', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('OD', 8)"
      comment: "注文ID（注文番号）（OD+8桁を採番）"
    customer_id:
      type: VARCHAR(10)
      nullable: false
      comment: "顧客ID FK→customers.id"
    sales_user_id:
      type: VARCHAR(10)
      nullable: false
      comment: "担当者ユーザID（注文顧客の担当 EMPLOYEE（BR-ORD-008）） FK→users.user_id"
    order_date:
      type: DATE
      nullable: false
      comment: "注文日"
    status:
      type: INT
      nullable: false
      comment: "状態（参照: 注文状態（T07-6：1=DRAFT, 2=PENDING_APPROVAL, 3=RETURNED, 4=APPROVED, 5=CANCELLED）。） FK→order_status_codes.order_status_code"
    subtotal_amount:
      type: NUMERIC(15,2)
      nullable: false
      default: "0"
      comment: "小計（サーバー再計算値）"
    tax_amount:
      type: NUMERIC(15,2)
      nullable: false
      default: "0"
      comment: "税額（サーバー再計算値）"
    total_amount:
      type: NUMERIC(15,2)
      nullable: false
      default: "0"
      comment: "合計（サーバー再計算値）"
    revised_from_order_id:
      type: VARCHAR(10)
      nullable: true
      comment: "訂正元注文ID（取消済み（CANCELLED）・同一顧客の元注文。新規作成時のみ設定し、1 注文につき訂正は 1 回（BR-ORD-009）） FK→orders.id"
    cancel_reason:
      type: VARCHAR(500)
      nullable: true
      comment: "取消し理由（CANCELLED のとき必須（chk_orders_cancel_reason））"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "idx_orders_cus_id_order_date"
      columns: ["customer_id", "order_date"]
      type: "BTREE"
    - name: "idx_orders_sales_user_status"
      columns: ["sales_user_id", "status"]
      type: "BTREE"
    - name: "idx_orders_status_order_date"
      columns: ["status", "order_date"]
      type: "BTREE"
    - name: "uq_orders_revised_from"
      columns: ["revised_from_order_id"]
      type: "UNIQUE"
      where: "revised_from_order_id IS NOT NULL AND deleted_at IS NULL"
  foreign_keys:
    - name: "fk_orders_customers"
      column: "customer_id"
      references: "customers(id)"
    - name: "fk_orders_users"
      column: "sales_user_id"
      references: "users(user_id)"
    - name: "fk_orders_order_status_codes"
      column: "status"
      references: "order_status_codes(order_status_code)"
    - name: "fk_orders_orders"
      column: "revised_from_order_id"
      references: "orders(id)"
  checks:
    - name: "chk_orders_cancel_reason"
      expression: "status <> 5 OR cancel_reason IS NOT NULL"

# ============================================= 注文明細
order_items:
  description: "注文明細。商品・税率は注文時点で複写する"
  id_generation: "next_business_id('OI', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('OI', 8)"
      comment: "注文明細ID（OI+8桁を採番）"
    order_id:
      type: VARCHAR(10)
      nullable: false
      comment: "注文ID FK→orders.id"
    line_number:
      type: NUMERIC
      nullable: false
      default: "0"
      comment: "行番号"
    product_id:
      type: VARCHAR(10)
      nullable: false
      comment: "商品ID FK→products.id"
    product_code:
      type: VARCHAR(50)
      nullable: false
      comment: "商品コード（複写）"
    product_name:
      type: VARCHAR(200)
      nullable: false
      comment: "商品名（複写）"
    quantity:
      type: NUMERIC(15,3)
      nullable: false
      default: "0"
      comment: "数量（0 より大きい（chk_order_items_quantity））"
    unit_price:
      type: NUMERIC(15,2)
      nullable: false
      default: "0"
      comment: "単価（商品の standard_unit_price の複写（保存・申請時。BR-PRD-002）。0 以上（chk_order_items_unit_price））"
    tax_category:
      type: INT
      nullable: false
      comment: "税区分（複写）（参照: 税区分（T07-5：1=STANDARD, 2=REDUCED, 3=EXEMPT）。） FK→tax_category_codes.tax_category_code"
    tax_rate:
      type: NUMERIC(5,2)
      nullable: false
      default: "0"
      comment: "税率（複写）"
    line_amount:
      type: NUMERIC(15,2)
      nullable: false
      default: "0"
      comment: "明細金額（quantity × unit_price）"
    tax_amount:
      type: NUMERIC(15,2)
      nullable: false
      default: "0"
      comment: "明細税額（HALF_UP(line_amount × tax_rate / 100)）"
    created_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "作成日時" }
    created_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "作成者（操作者のユーザ ID。システム処理は SYSTEM）" }
    updated_at: { type: TIMESTAMPTZ, nullable: false, default: "CURRENT_TIMESTAMP", comment: "更新日時（トリガーで更新。楽観ロックの照合に使用。API ではマイクロ秒 6 桁）" }
    updated_by: { type: VARCHAR(10), nullable: false, default: "'SYSTEM'", comment: "更新者" }
    deleted_at: { type: TIMESTAMPTZ, nullable: true, comment: "削除日時（論理削除（NULL=有効））" }
  indexes:
    - name: "uq_order_items_order_line_no"
      columns: ["order_id", "line_number"]
      type: "UNIQUE"
      where: "deleted_at IS NULL"
    - name: "idx_order_items_product_id"
      columns: ["product_id"]
      type: "BTREE"
    - name: "idx_order_items_tax_category"
      columns: ["tax_category"]
      type: "BTREE"
  foreign_keys:
    - name: "fk_order_items_orders"
      column: "order_id"
      references: "orders(id)"
    - name: "fk_order_items_products"
      column: "product_id"
      references: "products(id)"
    - name: "fk_order_items_tax_cat_codes"
      column: "tax_category"
      references: "tax_category_codes(tax_category_code)"
  checks:
    - name: "chk_order_items_quantity"
      expression: "quantity > 0"
    - name: "chk_order_items_unit_price"
      expression: "unit_price >= 0"

# ============================================= 注文状態履歴
order_status_histories:
  description: "注文状態の遷移履歴（追加専用）。変更者・日時は created_by / created_at"
  soft_delete: false   # no soft delete: 履歴テーブル
  id_generation: "next_business_id('OH', 8)"
  columns:
    id:
      type: VARCHAR(10)
      primary_key: true
      default: "next_business_id('OH', 8)"
      comment: "注文状態履歴ID（OH+8桁を採番）"
    order_id:
      type: VARCHAR(10)
      nullable: false
      comment: "注文ID FK→orders.id"
    from_status:
      type: INT
      nullable: true
      comment: "変更前状態（参照: 注文状態（T07-6：1=DRAFT, 2=PENDING_APPROVAL, 3=RETURNED, 4=APPROVED, 5=CANCELLED）。新規作成時は NULL） FK→order_status_codes.order_status_code"
    to_status:
      type: INT
