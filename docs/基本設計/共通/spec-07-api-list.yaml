openapi: 3.1.0
info:
  title: DDMSAA Sales API
  version: 1.0.0
  description: DDMSAA 販売システムの正式 API 定義。認証はログイン ID とパスワードを使用する。
servers:
  - url: /api
security:
  - sessionAuth: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: ログイン
      security: []
      x-roles: [PUBLIC]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses: { '200': { description: 認証済みセッション }, '401': { $ref: '#/components/responses/Unauthorized' }, '423': { description: ロック中 } }
  /auth/logout:
    post: { operationId: logout, summary: ログアウト, responses: { '204': { description: 完了 } } }
  /me:
    get: { operationId: getMe, summary: ログイン利用者取得, responses: { '200': { description: 本人情報 } } }
  /users:
    get: { operationId: listUsers, summary: 利用者一覧, x-roles: [ADMIN], responses: { '200': { description: 一覧 } } }
    post: { operationId: createUser, summary: 利用者登録, x-roles: [ADMIN], responses: { '201': { description: 登録完了 }, '409': { description: 重複 } } }
  /users/{userId}:
    patch: { operationId: updateUser, summary: 利用者更新, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: 更新完了 } } }
  /audit-logs:
    get: { operationId: listAuditLogs, summary: 監査ログ一覧, x-roles: [ADMIN], responses: { '200': { description: 一覧 } } }
  /customers:
    get: { operationId: listCustomers, summary: 顧客一覧, x-roles: [ADMIN, EMPLOYEE], responses: { '200': { description: 権限内一覧 } } }
    post: { operationId: createCustomer, summary: 顧客登録, x-roles: [ADMIN], responses: { '201': { description: 登録完了 } } }
  /customers/{customerId}:
    get: { operationId: getCustomer, summary: 顧客詳細, x-roles: [ADMIN, EMPLOYEE, CUSTOMER], parameters: [{ $ref: '#/components/parameters/CustomerId' }], responses: { '200': { description: 権限内詳細 } } }
    patch: { operationId: updateCustomer, summary: 顧客更新, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/CustomerId' }], responses: { '200': { description: 更新完了 } } }
  /customers/{customerId}/status:
    patch: { operationId: updateCustomerStatus, summary: 顧客状態更新, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/CustomerId' }], responses: { '200': { description: 更新完了 } } }
  /products:
    get: { operationId: listProducts, summary: 商品一覧, x-roles: [ADMIN, EMPLOYEE], responses: { '200': { description: 一覧 } } }
    post: { operationId: createProduct, summary: 商品登録, x-roles: [ADMIN], responses: { '201': { description: 登録完了 } } }
  /products/{productId}:
    get: { operationId: getProduct, summary: 商品詳細, x-roles: [ADMIN, EMPLOYEE], parameters: [{ $ref: '#/components/parameters/ProductId' }], responses: { '200': { description: 詳細 } } }
    patch: { operationId: updateProduct, summary: 商品更新, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/ProductId' }], responses: { '200': { description: 更新完了 } } }
  /products/{productId}/status:
    patch: { operationId: updateProductStatus, summary: 商品状態更新, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/ProductId' }], responses: { '200': { description: 更新完了 } } }
  /orders:
    get: { operationId: listOrders, summary: 注文検索, x-roles: [ADMIN, EMPLOYEE, CUSTOMER], responses: { '200': { description: 行単位認可済み一覧 } } }
    post: { operationId: createOrder, summary: 下書き注文登録, x-roles: [ADMIN, EMPLOYEE], responses: { '201': { description: 登録完了 } } }
  /orders/{orderId}:
    get: { operationId: getOrder, summary: 注文詳細, x-roles: [ADMIN, EMPLOYEE, CUSTOMER], parameters: [{ $ref: '#/components/parameters/OrderId' }], responses: { '200': { description: 権限内詳細 } } }
    patch: { operationId: updateOrder, summary: 注文更新, x-roles: [ADMIN, EMPLOYEE], parameters: [{ $ref: '#/components/parameters/OrderId' }], responses: { '200': { description: 更新完了 }, '409': { description: 状態または version の競合 } } }
  /orders/{orderId}/submit:
    post: { operationId: submitOrder, summary: 承認依頼, x-roles: [ADMIN, EMPLOYEE], parameters: [{ $ref: '#/components/parameters/OrderId' }], responses: { '202': { description: 依頼登録 } } }
  /orders/{orderId}/cancel:
    post: { operationId: cancelOrder, summary: 注文取消, x-roles: [ADMIN, EMPLOYEE], parameters: [{ $ref: '#/components/parameters/OrderId' }], responses: { '200': { description: 取消完了 } } }
  /approval-requests/{approvalRequestId}/approve:
    post: { operationId: approveOrder, summary: 注文承認, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/ApprovalRequestId' }], responses: { '200': { description: 承認結果 } } }
  /approval-requests/{approvalRequestId}/return:
    post: { operationId: returnOrder, summary: 注文差戻し, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/ApprovalRequestId' }], responses: { '200': { description: 差戻し完了 } } }
  /orders/{orderId}/approval-history:
    get: { operationId: getApprovalHistory, summary: 承認履歴, x-roles: [ADMIN, EMPLOYEE, CUSTOMER], parameters: [{ $ref: '#/components/parameters/OrderId' }], responses: { '200': { description: 権限内履歴 } } }
  /approvals/pending:
    get: { operationId: listPendingApprovals, summary: 承認待ち一覧, x-roles: [ADMIN], responses: { '200': { description: 一覧 } } }
  /approval-rules:
    get: { operationId: listApprovalRules, summary: 承認ルール一覧, x-roles: [ADMIN], responses: { '200': { description: 一覧 } } }
    post: { operationId: createApprovalRule, summary: 承認ルール登録, x-roles: [ADMIN], responses: { '201': { description: 登録完了 } } }
  /approval-rules/{ruleId}:
    patch: { operationId: updateApprovalRule, summary: 承認ルール更新, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/RuleId' }], responses: { '200': { description: 更新完了 } } }
  /notifications:
    get: { operationId: listNotifications, summary: 通知履歴一覧, x-roles: [ADMIN], responses: { '200': { description: 一覧 } } }
  /notifications/{notificationId}/retry:
    post: { operationId: retryNotification, summary: 失敗通知再送, x-roles: [ADMIN], parameters: [{ $ref: '#/components/parameters/NotificationId' }], responses: { '202': { description: 再送登録 } } }
  /orders/{orderId}/attachments:
    get: { operationId: listOrderAttachments, summary: 添付一覧, x-roles: [ADMIN, EMPLOYEE, CUSTOMER], parameters: [{ $ref: '#/components/parameters/OrderId' }], responses: { '200': { description: 可視性で絞り込み済み一覧 } } }
    post: { operationId: uploadOrderAttachment, summary: 添付アップロード, x-roles: [ADMIN, EMPLOYEE], parameters: [{ $ref: '#/components/parameters/OrderId' }], responses: { '202': { description: スキャン待ちで登録 } } }
  /attachments/{attachmentId}/download:
    get: { operationId: downloadAttachment, summary: 添付ダウンロード, x-roles: [ADMIN, EMPLOYEE, CUSTOMER], parameters: [{ $ref: '#/components/parameters/AttachmentId' }], responses: { '200': { description: 認可済みファイル } } }
  /attachments/{attachmentId}:
    delete: { operationId: deleteAttachment, summary: 添付削除, x-roles: [ADMIN, EMPLOYEE], parameters: [{ $ref: '#/components/parameters/AttachmentId' }], responses: { '204': { description: 削除完了 } } }
  /reports/orders/summary:
    get: { operationId: getOrderSummary, summary: 注文集計, x-roles: [ADMIN, EMPLOYEE], responses: { '200': { description: 集計結果 } } }
  /reports/customers:
    get: { operationId: getCustomerReport, summary: 顧客別集計, x-roles: [ADMIN, EMPLOYEE], responses: { '200': { description: 集計結果 } } }
  /reports/products:
    get: { operationId: getProductReport, summary: 商品別集計, x-roles: [ADMIN, EMPLOYEE], responses: { '200': { description: 集計結果 } } }
  /exports/orders:
    post: { operationId: createOrderExport, summary: CSV 出力ジョブ登録, x-roles: [ADMIN, EMPLOYEE], responses: { '202': { description: ジョブ登録 } } }
  /exports/{exportId}:
    get: { operationId: getExportJob, summary: 出力ジョブ状態取得, x-roles: [ADMIN, EMPLOYEE], parameters: [{ $ref: '#/components/parameters/ExportId' }], responses: { '200': { description: ジョブ状態 } } }
  /exports/{exportId}/download:
    get: { operationId: downloadExport, summary: CSV ダウンロード, x-roles: [ADMIN, EMPLOYEE], parameters: [{ $ref: '#/components/parameters/ExportId' }], responses: { '200': { description: UTF-8 BOM CSV } } }
  /orders/{orderId}/document:
    get: { operationId: downloadOrderDocument, summary: PDF 注文書ダウンロード, x-roles: [ADMIN, EMPLOYEE, CUSTOMER], parameters: [{ $ref: '#/components/parameters/OrderId' }], responses: { '200': { description: 承認済み注文の PDF } } }
components:
  securitySchemes:
    sessionAuth: { type: apiKey, in: cookie, name: DDMSAA_SESSION }
  parameters:
    UserId: { name: userId, in: path, required: true, schema: { type: string } }
    CustomerId: { name: customerId, in: path, required: true, schema: { type: string } }
    ProductId: { name: productId, in: path, required: true, schema: { type: string } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string } }
    ApprovalRequestId: { name: approvalRequestId, in: path, required: true, schema: { type: string } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string } }
  schemas:
    LoginRequest: { type: object, required: [loginId, password], properties: { loginId: { type: string }, password: { type: string, format: password } } }
  responses:
    Unauthorized: { description: 認証失敗。利用者の存在・状態は識別できない。 }
