# =====================================================================
# 07 API 一覧・定義（OpenAPI 3.0 形式 / 機械可読 SSOT）
# ---------------------------------------------------------------------
# 用途：API の機械可読な定義。Swagger UI / Postman にインポートしたり、openapi-generator でコード生成したりできる。
# 使い方：本ファイルを複製 → 例を置換 → 必要に応じて paths 配下のエンドポイントを増減する。spec-07-api-list-ui.md と対で用いる。
# 規約（spec-naming-rule / 共通基盤と一致）：
#   - operationId = camelCase の動詞（createUser）。**API の唯一の正式識別子**であり、API-0NN は使用しない。
#   - リソースパスは複数形・kebab（/users、/system-locks）、項目は camelCase、列挙値は UPPER_SNAKE。
#   - 統一レスポンス Result<T> / PageResult<T> / ErrorResponse。**messageId(+messageArgs) のみを返し、表示文言は返さない**。
#   - HTTP ステータスの固定集合は 基本設計/共通/spec-07-api-list-ui.md に従う。
# 注意：YAML のインデントはスペースのみ（タブ不可）。x-roles / x-function-id は本プロジェクトの拡張（ロール・機能 ID のトレース用）。
# =====================================================================

openapi: 3.0.3

info:
  title: "DDMSAA API"
  description: "DDMSAA の REST API 定義（共通基盤準拠）"
  version: 1.0.0

servers:
  - url: /api/v1
    description: 共通ベースパス

security:
  - bearerAuth: []             # デフォルトは認証必須。公開エンドポイントは個別に security: []

# ---------------------------------------------------------------------
# tags：機能の大分類ごとにグループ化
# ---------------------------------------------------------------------
tags:
  - name: auth
    description: 認証（F-AUTH）— auth-service
  - name: users
    description: ユーザ管理（F-USR）
  - name: customers
    description: 顧客管理（F-CUS）
  - name: products
    description: 商品管理（F-PRD）
  - name: orders
    description: 注文管理（F-ORD）
  - name: approvals
    description: 承認（F-APR）
  - name: attachments
    description: 添付（F-ATT）
  - name: reports
    description: 帳票・集計・CSV（F-RPT）
  - name: operations
    description: 通知履歴・監査（F-NTF / F-AUD）

# ---------------------------------------------------------------------
# paths：各 URL の下に HTTP メソッドごとにエンドポイントを定義（operationId=camelCase の動詞）
#   /auth/** は auth-service、それ以外は business-service-core（Gateway がルーティング）
# ---------------------------------------------------------------------
# rule: api.endpoint-definitions
paths:

  /auth/login-init:
    post:
      tags: [auth]
      operationId: loginInit
      summary: ログイン開始（ユーザID → Magic Link 送信）
      description: 可否・存在に関わらず常に 200 / I0001（基盤 spec-02 §6.1）
      x-function-id: F-AUTH-01
      x-roles: []                     # 公開
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInitRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/magic-link/verify:
    post:
      tags: [auth]
      operationId: verifyMagicLink
      summary: Magic Link 検証・JWT 発行
      description: 無効・期限切れ・可否 NG は 401 / E0004
      x-function-id: F-AUTH-01
      x-roles: []                     # 公開
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkVerifyRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { $ref: '#/components/schemas/TokenResponse' } } } ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/magic-link/resend:
    post:
      tags: [auth]
      operationId: resendMagicLink
      summary: Magic Link 再送
      description: 常に 200 / I0001
      x-function-id: F-AUTH-01
      x-roles: []                     # 公開
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInitRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: ログイン利用者情報
      x-function-id: F-AUTH-02
      x-roles: [ADMIN, EMPLOYEE, CUSTOMER]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { $ref: '#/components/schemas/MeVO' } } } ] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [users]
      operationId: pageUsers
      summary: ユーザ一覧
      description: 並び順は固定（ユーザーID 昇順）
      x-function-id: F-USR-01
      x-roles: [ADMIN]
      parameters:
        - { name: pageNum, in: query, required: false, schema: { type: integer, format: int32, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 100 } }
        - { name: keyword, in: query, required: false, schema: { type: string }, description: "ユーザID・表示名・メールの部分一致" }
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: isLocked, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageResult' }, { type: object, properties: { records: { type: array, items: { $ref: '#/components/schemas/UserVO' } } } } ] } } } ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createUser
      summary: ユーザ登録・採番（ロールに応じ A/E/C）
      description: 成功 I0010（{0}=ユーザID）
      x-function-id: F-USR-02
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultString' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}:
    get:
      tags: [users]
      operationId: getUser
      summary: ユーザ詳細
      x-function-id: F-USR-03
      x-roles: [ADMIN]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string }, example: "E0001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { $ref: '#/components/schemas/UserVO' } } } ] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [users]
      operationId: updateUser
      summary: ユーザ更新
      description: 成功 I0011。updatedAt で楽観ロック（不一致 409 E0051）。ロール変更は ADMIN ⇔ EMPLOYEE のみで、CUSTOMER との相互変更は 400 E0008。ユーザIDは不変（BR-USR-004）。自分自身のロール変更は 409 E0006、最後の有効 ADMIN の降格は 409 E0055（BR-USR-005）。担当が残る EMPLOYEE の変更は 409 E0006
      x-function-id: F-USR-03
      x-roles: [ADMIN]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string }, example: "E0001" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}/disable:
    post:
      tags: [users]
      operationId: disableUser
      summary: 停用
      description: 成功 I0032。自分自身は 409 E0006、最後の有効 ADMIN は 409 E0055（BR-USR-005）
      x-function-id: F-USR-04
      x-roles: [ADMIN]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string }, example: "E0001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}/enable:
    post:
      tags: [users]
      operationId: enableUser
      summary: 停用解除
      description: 成功 I0033
      x-function-id: F-USR-04
      x-roles: [ADMIN]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string }, example: "E0001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}/lock:
    post:
      tags: [users]
      operationId: lockUser
      summary: ロック（system_locks）
      description: 成功 I0025。自分自身は 409 E0006、最後の有効 ADMIN は 409 E0055（BR-USR-005）
      x-function-id: F-USR-05
      x-roles: [ADMIN]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string }, example: "E0001" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLockDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}/unlock:
    post:
      tags: [users]
      operationId: unlockUser
      summary: ロック解除
      description: 成功 I0029
      x-function-id: F-USR-05
      x-roles: [ADMIN]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string }, example: "E0001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers:
    get:
      tags: [customers]
      operationId: pageCustomers
      summary: 顧客一覧（EMPLOYEE は担当顧客のみ）
      description: 並び順は固定（顧客コード昇順）。範囲外の顧客は除外（BR-AUTH-006）
      x-function-id: F-CUS-01
      x-roles: [ADMIN, EMPLOYEE]
      parameters:
        - { name: pageNum, in: query, required: false, schema: { type: integer, format: int32, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 100 } }
        - { name: keyword, in: query, required: false, schema: { type: string }, description: "顧客コード・顧客名の部分一致" }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/CustomerStatus' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageResult' }, { type: object, properties: { records: { type: array, items: { $ref: '#/components/schemas/CustomerSummaryVO' } } } } ] } } } ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [customers]
      operationId: createCustomer
      summary: 顧客登録（連絡先・担当社員を含む）
      description: 成功 I0010
      x-function-id: F-CUS-03
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSaveDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultString' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: 顧客詳細（CUSTOMER は自社のみ。担当社員は返さない）
      x-function-id: F-CUS-02
      x-roles: [ADMIN, EMPLOYEE, CUSTOMER]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string }, example: "CS00000001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { $ref: '#/components/schemas/CustomerVO' } } } ] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: 顧客更新（連絡先・担当社員を全件置換）
      description: 成功 I0011。updatedAt 不一致は 409 E0051。担当社員の解除は is_active=false、同じ社員の再割当は同じ行を有効に戻す（割当日を当日に更新）
      x-function-id: F-CUS-04
      x-roles: [ADMIN]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string }, example: "CS00000001" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSaveDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{customerId}/activate:
    post:
      tags: [customers]
      operationId: activateCustomer
      summary: 顧客を有効化
      description: 成功 I0034
      x-function-id: F-CUS-05
      x-roles: [ADMIN]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string }, example: "CS00000001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{customerId}/deactivate:
    post:
      tags: [customers]
      operationId: deactivateCustomer
      summary: 顧客を無効化（新規注文の対象外）
      description: 成功 I0035。以後、新規注文・申請の対象外（BR-CUS-002）
      x-function-id: F-CUS-05
      x-roles: [ADMIN]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string }, example: "CS00000001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products:
    get:
      tags: [products]
      operationId: pageProducts
      summary: 商品一覧
      description: 並び順は固定（商品コード昇順）。EMPLOYEE は status 指定に関わらず ACTIVE のみ（BR-PRD-003）
      x-function-id: F-PRD-01
      x-roles: [ADMIN, EMPLOYEE]
      parameters:
        - { name: pageNum, in: query, required: false, schema: { type: integer, format: int32, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 100 } }
        - { name: keyword, in: query, required: false, schema: { type: string }, description: "商品コード・商品名の部分一致" }
        - { name: productCategory, in: query, required: false, schema: { type: string } }
        - { name: taxCategory, in: query, required: false, schema: { $ref: '#/components/schemas/TaxCategory' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ProductStatus' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageResult' }, { type: object, properties: { records: { type: array, items: { $ref: '#/components/schemas/ProductVO' } } } } ] } } } ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [products]
      operationId: createProduct
      summary: 商品登録
      description: 成功 I0010
      x-function-id: F-PRD-03
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductSaveDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultString' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProduct
      summary: 商品詳細
      x-function-id: F-PRD-02
      x-roles: [ADMIN, EMPLOYEE]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string }, example: "PR00000001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { $ref: '#/components/schemas/ProductVO' } } } ] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [products]
      operationId: updateProduct
      summary: 商品更新
      description: 成功 I0011。updatedAt 不一致は 409 E0051。DRAFT / RETURNED 注文は次回保存時に新しい値で再複写される（BR-PRD-002）
      x-function-id: F-PRD-04
      x-roles: [ADMIN]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string }, example: "PR00000001" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductSaveDTO' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{productId}/activate:
    post:
      tags: [products]
      operationId: activateProduct
      summary: 商品を有効化
      description: 成功 I0034
      x-function-id: F-PRD-05
      x-roles: [ADMIN]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string }, example: "PR00000001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{productId}/deactivate:
    post:
      tags: [products]
      operationId: deactivateProduct
      summary: 商品を無効化（新規注文で選択不可）
      description: 成功 I0035。以後、明細への追加・申請の対象外（BR-PRD-003）
      x-function-id: F-PRD-05
      x-roles: [ADMIN]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string }, example: "PR00000001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tax-rates:
    get:
      tags: [products]
      operationId: listTaxRates
      summary: 税率一覧
