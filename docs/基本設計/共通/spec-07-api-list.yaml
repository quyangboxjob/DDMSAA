        - { name: pageNum, in: query, required: false, schema: { type: integer, format: int32, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 100 } }
        - { name: requestedBy, in: query, required: false, schema: { type: string, maxLength: 10 }, description: "依頼者のユーザー ID（完全一致。ADMIN のみ有効。EMPLOYEE は指定しても自分に固定）" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageResult' }, { type: object, properties: { records: { type: array, items: { $ref: '#/components/schemas/ExportJobVO' } } } } ] } } } ] }
        '403': { $ref: '#/components/responses/Forbidden' }

  /export-jobs/{exportJobId}:
    get:
      tags: [reports]
      operationId: getExportJob
      summary: 出力ジョブ状態
      x-function-id: F-RPT-03
      x-roles: [ADMIN, EMPLOYEE]
      parameters:
        - { name: exportJobId, in: path, required: true, schema: { type: string }, example: "EJ00000001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { $ref: '#/components/schemas/ExportJobVO' } } } ] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /export-jobs/{exportJobId}/download:
    get:
      tags: [reports]
      operationId: downloadExportJob
      summary: CSV ダウンロード（UTF-8 BOM・READY のみ）
      x-function-id: F-RPT-03
      x-roles: [ADMIN, EMPLOYEE]
      parameters:
        - { name: exportJobId, in: path, required: true, schema: { type: string }, example: "EJ00000001" }
      responses:
        '200':
          description: ファイル（Result で包まない。Content-Disposition 付き）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notification-logs:
    get:
      tags: [operations]
      operationId: pageNotificationLogs
      summary: 通知履歴
      description: 並び順は固定（作成日時の新しい順）
      x-function-id: F-NTF-01
      x-roles: [ADMIN]
      parameters:
        - { name: pageNum, in: query, required: false, schema: { type: integer, format: int32, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 100 } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/NotificationStatus' } }
        - { name: notificationEvent, in: query, required: false, schema: { $ref: '#/components/schemas/NotificationEvent' } }
        - { name: createdDateFrom, in: query, required: false, schema: { type: string, format: date } }
        - { name: createdDateTo, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageResult' }, { type: object, properties: { records: { type: array, items: { $ref: '#/components/schemas/NotificationLogVO' } } } } ] } } } ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notification-logs/{notificationLogId}/retry:
    post:
      tags: [operations]
      operationId: retryNotification
      summary: 失敗通知の再送
      description: FAILED のみ（他の状態は 409 E0006）。attempt_count を 0、next_attempt_at を現在時刻に戻して QUEUED にする（BR-NTF-002）。成功 I0026
      x-function-id: F-NTF-01
      x-roles: [ADMIN]
      parameters:
        - { name: notificationLogId, in: path, required: true, schema: { type: string }, example: "NL00000001" }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultVoid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /audit-logs:
    get:
      tags: [operations]
      operationId: pageAuditLogs
      summary: 監査ログ
      description: 並び順は固定（発生日時の新しい順）
      x-function-id: F-AUD-01
      x-roles: [ADMIN]
      parameters:
        - { name: pageNum, in: query, required: false, schema: { type: integer, format: int32, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 100 } }
        - { name: actorUserId, in: query, required: false, schema: { type: string, maxLength: 10 }, description: 操作者のユーザー ID（完全一致） }
        - { name: auditAction, in: query, required: false, schema: { type: string } }
        - { name: targetType, in: query, required: false, schema: { type: string } }
        - { name: targetId, in: query, required: false, schema: { type: string } }
        - { name: occurredDateFrom, in: query, required: false, schema: { type: string, format: date } }
        - { name: occurredDateTo, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/Result' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageResult' }, { type: object, properties: { records: { type: array, items: { $ref: '#/components/schemas/AuditLogVO' } } } } ] } } } ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ---------------------------------------------------------------------
# components：統一レスポンスエンベロープ（Result/PageResult/ErrorResponse）、スキーマ、セキュリティスキーム
# ---------------------------------------------------------------------
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 不正なリクエスト / チェックエラー（400）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { messageId: "E00NN", message: "入力内容に誤りがあります", timestamp: "2026-06-10T10:00:00+09:00", path: "/api/v1/xxx", traceId: "abc123", details: [ { field: "email", reason: "必須項目です" } ] }
    Unauthorized:
      description: 未認証（401）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 権限不足（403）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: リソースなし（404）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 状態の競合（409。状態不可 E0006、楽観ロック不一致 E0051 ほか）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: ファイルサイズ超過（413。1 ファイル E0010、注文合計 E0052）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    # rule: api.envelope-schemas
    # ---- 統一レスポンスエンベロープ ----
    Result:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: "0" }
        message: { type: string, description: "サーバ側の既定文言（フォールバック）。表示は messageId を正とする", example: "success" }
        messageId: { type: string, description: "messages の表示用メッセージID（I/W）。フロントエンドが解決して表示する", example: "I00NN" }
        messageArgs: { type: array, items: { type: string }, description: "messageId の {0},{1} の置換値" }
        traceId: { type: string, example: "abc123" }
        timestamp: { type: string, format: date-time, example: "2026-06-10T10:00:00+09:00" }
    ResultObject:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties: { data: { type: object, nullable: true } }
    ResultString:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties: { data: { type: string, example: "E0001" } }
    ResultVoid:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties: { data: { type: object, nullable: true, example: null } }
    PageResult:
      type: object
      required: [records, total, pageNum, pageSize, pages]
      properties:
        records: { type: array, items: { type: object } }
        total: { type: integer, format: int64, example: 120 }
        pageNum: { type: integer, format: int32, example: 1 }
        pageSize: { type: integer, format: int32, example: 20 }
        pages: { type: integer, format: int32, example: 6 }
    ErrorResponse:
      type: object
      required: [messageId, message, timestamp, path]
      properties:
        messageId: { type: string, description: "messages のエラーメッセージID（E）。識別・表示を一本化", example: "E00NN" }
        messageArgs: { type: array, items: { type: string } }
        message: { type: string, description: "サーバ側の既定文言（フォールバック/ログ用）", example: "入力内容に誤りがあります" }
        timestamp: { type: string, format: date-time, example: "2026-06-10T10:00:00+09:00" }
        path: { type: string, example: "/api/v1/users" }
        traceId: { type: string, example: "abc123" }
        details:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      properties:
        field: { type: string, example: "email" }
        reason: { type: string, example: "必須項目です" }

    # ---- 列挙（UPPER_SNAKE。値域はデータ辞書 T07 を正とする）----
    Role:
      type: string
      description: ロール（T07-1）
      enum: [ADMIN, EMPLOYEE, CUSTOMER]
    UserStatus:
      type: string
      description: 利用者状態（T07-2）
      enum: [ACTIVE, DISABLED]
    CustomerStatus:
      type: string
      description: 顧客状態（T07-3）
      enum: [ACTIVE, INACTIVE]
    ProductStatus:
      type: string
      description: 商品状態（T07-4）
      enum: [ACTIVE, INACTIVE]
    TaxCategory:
      type: string
      description: 税区分（T07-5）
      enum: [STANDARD, REDUCED, EXEMPT]
    OrderStatus:
      type: string
      description: 注文状態（T07-6）
      enum: [DRAFT, PENDING_APPROVAL, RETURNED, APPROVED, CANCELLED]
    ApprovalRequestStatus:
      type: string
      description: 承認依頼状態（T07-7）
      enum: [PENDING, APPROVED, RETURNED]
    ApprovalAction:
      type: string
      description: 承認操作（T07-8）
      enum: [APPROVE, RETURN]
    AttachmentVisibility:
      type: string
      description: 添付公開範囲（T07-9）
      enum: [INTERNAL, CUSTOMER]
    ScanStatus:
      type: string
      description: スキャン状態（T07-10）
      enum: [PENDING, SAFE, REJECTED]
    NotificationEvent:
      type: string
      description: 通知イベント（T07-11）
      enum: [ORDER_SUBMITTED, ORDER_APPROVED, ORDER_RETURNED, ORDER_CANCELLED, EXPORT_COMPLETED]
    NotificationStatus:
      type: string
      description: 通知状態（T07-12）
      enum: [QUEUED, SENDING, SENT, FAILED]
    ExportStatus:
      type: string
      description: 出力状態（T07-13）
      enum: [QUEUED, RUNNING, READY, FAILED, EXPIRED]

    # ---- 業務データ構造（項目は camelCase。VO=応答、DTO=要求）----
    LoginInitRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, maxLength: 10, example: "E0001", description: ユーザID }
    MagicLinkVerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: メールの Magic Link に含まれるワンタイムトークン }
    TokenResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: "Bearer" }
    MeVO:
      type: object
      properties:
        userId: { type: string, example: "E0001" }
        userName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        customerId: { type: string, nullable: true, description: CUSTOMER のみ }
        customerName: { type: string, nullable: true }
    UserVO:
      type: object
      properties:
        userId: { type: string }
        userName: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        customerId: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        isLocked: { type: boolean }
        lockStartedAt: { type: string, format: date-time, nullable: true }
        lockReason: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    UserCreateDTO:
      type: object
      required: [userName, email, role]
      properties:
        userName: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 255, format: email, description: Magic Link 送信先 }
        role: { $ref: '#/components/schemas/Role' }
        customerId: { type: string, maxLength: 10, description: role=CUSTOMER のとき必須。ADMIN / EMPLOYEE は指定不可（BR-USR-003） }
    UserUpdateDTO:
      type: object
      required: [userName, email, role, updatedAt]
      properties:
        userName: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 255, format: email }
        role: { $ref: '#/components/schemas/Role' }
        customerId: { type: string, maxLength: 10, description: role=CUSTOMER のとき必須。ADMIN / EMPLOYEE は指定不可（BR-USR-003） }
        updatedAt: { type: string, format: date-time, description: 楽観ロック用（取得時の値） }
    UserLockDTO:
      type: object
      properties:
        lockReason: { type: string, maxLength: 500 }
    CustomerSummaryVO:
      type: object
      properties:
        id: { type: string, example: "CS00000001" }
        customerCode: { type: string }
        customerName: { type: string }
        email: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CustomerStatus' }
    CustomerVO:
      type: object
      properties:
        id: { type: string }
        customerCode: { type: string }
        customerName: { type: string }
        email: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CustomerStatus' }
        contacts: { type: array, items: { $ref: '#/components/schemas/CustomerContactDTO' } }
        assignedEmployees: { type: array, items: { $ref: '#/components/schemas/AssignedEmployeeVO' }, description: CUSTOMER には返さない }
        updatedAt: { type: string, format: date-time }
    CustomerContactDTO:
      type: object
      required: [contactName, email]
      properties:
        id: { type: string, description: 既存行の更新時のみ }
        contactName: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 255, format: email }
        isNotificationRecipient: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
    AssignedEmployeeVO:
      type: object
      properties:
        userId: { type: string }
        userName: { type: string }
        assignedDate: { type: string, format: date, description: 割当日（再割当時は当日） }
    CustomerSaveDTO:
      type: object
      required: [customerCode, customerName]
      properties:
        customerCode: { type: string, maxLength: 30, pattern: '^[A-Za-z0-9-]+$', description: 英数字とハイフン。更新時は変更不可 }
        customerName: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 255, format: email }
        phoneNumber: { type: string, maxLength: 50 }
        contacts: { type: array, items: { $ref: '#/components/schemas/CustomerContactDTO' } }
        assignedEmployeeUserIds: { type: array, items: { type: string, pattern: '^[AEC][0-9]{4}$' }, description: 担当 EMPLOYEE のユーザID（有効な EMPLOYEE） }
        updatedAt: { type: string, format: date-time, description: 更新時は必須（楽観ロック） }
    ProductVO:
      type: object
      properties:
        id: { type: string, example: "PR00000001" }
        productCode: { type: string }
        productName: { type: string }
        productCategory: { type: string, nullable: true }
        standardUnitPrice: { type: number, multipleOf: 0.01 }
        taxCategory: { $ref: '#/components/schemas/TaxCategory' }
        taxRate: { type: number }
        status: { $ref: '#/components/schemas/ProductStatus' }
        updatedAt: { type: string, format: date-time }
    ProductSaveDTO:
      type: object
      required: [productCode, productName, standardUnitPrice, taxCategory]
      properties:
        productCode: { type: string, maxLength: 50, description: 更新時は変更不可 }
        productName: { type: string, maxLength: 200 }
        productCategory: { type: string, maxLength: 100 }
        standardUnitPrice: { type: number, multipleOf: 0.01, minimum: 0 }
        taxCategory: { $ref: '#/components/schemas/TaxCategory' }
        updatedAt: { type: string, format: date-time, description: 更新時は必須（楽観ロック） }
    TaxRateVO:
      type: object
      properties:
        taxCategory: { $ref: '#/components/schemas/TaxCategory' }
        taxRate: { type: number, example: 10.00 }
    OrderSummaryVO:
      type: object
      properties:
        id: { type: string, description: 注文番号, example: "OD00000001" }
        customerId: { type: string }
        customerName: { type: string }
        orderDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/OrderStatus' }
        totalAmount: { type: number, multipleOf: 0.01 }
        salesUserId: { type: string }
        salesUserName: { type: string }
        updatedAt: { type: string, format: date-time }
    OrderVO:
      type: object
      properties:
        id: { type: string, description: 注文番号 }
        customerId: { type: string }
        customerName: { type: string }
        salesUserId: { type: string }
        salesUserName: { type: string }
        orderDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/OrderStatus' }
        subtotalAmount: { type: number, multipleOf: 0.01 }
        taxAmount: { type: number, multipleOf: 0.01 }
        totalAmount: { type: number, multipleOf: 0.01 }
        revisedFromOrderId: { type: string, nullable: true }
        cancelReason: { type: string, nullable: true, description: CUSTOMER には null（BR-APR-006） }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItemVO' } }
        statusHistories: { type: array, items: { $ref: '#/components/schemas/OrderStatusHistoryVO' } }
        currentApprovalRequestId: { type: string, nullable: true, description: PENDING_APPROVAL のときの承認依頼ID }
        canApprove: { type: boolean, description: "ログイン者がこの注文を承認・差戻しできるか（ADMIN かつ PENDING_APPROVAL かつ申請者本人でない。BR-APR-002）" }
        updatedAt: { type: string, format: date-time, description: 楽観ロック用（マイクロ秒 6 桁。そのまま返送する） }
    OrderItemVO:
      type: object
      properties:
        id: { type: string }
        lineNumber: { type: integer }
        productId: { type: string }
        productCode: { type: string }
        productName: { type: string }
        quantity: { type: number, multipleOf: 0.001 }
        unitPrice: { type: number, multipleOf: 0.01 }
        taxCategory: { $ref: '#/components/schemas/TaxCategory' }
        taxRate: { type: number }
        lineAmount: { type: number, multipleOf: 0.01 }
        taxAmount: { type: number, multipleOf: 0.01 }
    OrderStatusHistoryVO:
      type: object
      properties:
        fromStatus: { allOf: [ { $ref: '#/components/schemas/OrderStatus' } ], nullable: true }
        toStatus: { $ref: '#/components/schemas/OrderStatus' }
        reason: { type: string, nullable: true, description: CUSTOMER には null（BR-APR-006） }
        changedBy: { type: string, nullable: true, description: CUSTOMER には null（BR-APR-006） }
        changedByName: { type: string, nullable: true, description: CUSTOMER には null（BR-APR-006） }
        changedAt: { type: string, format: date-time }
    OrderSaveDTO:
      type: object
      required: [customerId, orderDate, items]
      properties:
        customerId: { type: string, maxLength: 10, description: 有効かつ（EMPLOYEE は）担当顧客。更新時は変更不可 }
        salesUserId: { type: string, pattern: '^[AEC][0-9]{4}$', description: "担当者（BR-ORD-008）。ADMIN は必須（顧客の有効な担当 EMPLOYEE）。EMPLOYEE は指定不要（本人を設定）。更新時の変更は ADMIN のみ" }
        orderDate: { type: string, format: date }
        revisedFromOrderId: { type: string, maxLength: 10, description: "訂正元（BR-ORD-009）。新規作成時のみ指定でき、CANCELLED・同一顧客・未訂正の注文に限る。更新時は無視する" }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItemSaveDTO' }, minItems: 1, maxItems: 999, description: "明細金額・小計・合計が numeric(15,2)（整数 13 桁）を超える場合は 400 E0008" }
        updatedAt: { type: string, format: date-time, description: 更新時は必須（楽観ロック） }
    OrderItemSaveDTO:
      type: object
      required: [productId, quantity]
      description: 単価は受け付けない。商品の標準単価をサーバーで複写する（BR-PRD-002）
      properties:
        productId: { type: string, maxLength: 10, description: 追加・変更する明細は有効商品。既存の無効商品の明細は保存可（申請時に 409 E0054） }
        quantity: { type: number, multipleOf: 0.001, exclusiveMinimum: true, minimum: 0, maximum: 999999999999.999, description: numeric(15,3) }
    OrderStateDTO:
      type: object
      required: [updatedAt]
      properties:
        updatedAt: { type: string, format: date-time, description: 楽観ロック用 }
    OrderCancelDTO:
      type: object
      required: [cancelReason, updatedAt]
      properties:
        cancelReason: { type: string, minLength: 1, maxLength: 500 }
        updatedAt: { type: string, format: date-time }
    ApprovalRequestVO:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        customerName: { type: string }
        totalAmount: { type: number, multipleOf: 0.01 }
        approvalStep: { type: integer }
        status: { $ref: '#/components/schemas/ApprovalRequestStatus' }
        requestedBy: { type: string, description: 申請者（approval_requests.created_by） }
        requestedByName: { type: string }
        requestedAt: { type: string, format: date-time }
