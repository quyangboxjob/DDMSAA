# =============================================================================
# 消息一览（中文翻译目录）- DDMSAA
# -----------------------------------------------------------------------------
# 本文件是 spec-09-message-list.yaml（ja 正本）的中文翻译。
#   - messageId 与 category 全语言共通，仅 message 文言为中文。
#   - 采番规则・号段・HTTP 状态方针详见 基本設計/共通/spec-09-message-list-ui.md（本文件不重复）。
#   - 占位符 {0},{1}... 与 ja 正本一一对应。
# =============================================================================

messages:

  # =========================================================== INFO（正常・提示）
  I0001: { category: INFO, message: "已发送认证邮件，请点击邮件中的链接完成认证" }
  I0003: { category: INFO, message: "已登录" }
  I0010: { category: INFO, message: "已登记（ID: {0}）" }
  I0011: { category: INFO, message: "已更新" }
  I0012: { category: INFO, message: "已删除" }

  # =========================================================== WARNING（注意・确认）
  W0010: { category: WARNING, message: "将执行删除，确定吗？" }
  W0011: { category: WARNING, message: "将放弃已输入的内容，确定吗？" }

  # =========================================================== ERROR（错误）
  # --- 认证・授权 ---
  E0001: { category: ERROR, message: "会话已过期，请重新登录" }
  E0002: { category: ERROR, message: "您没有执行此操作的权限" }
  E0003: { category: ERROR, message: "操作次数已达上限，请稍后再试" }
  E0004: { category: ERROR, message: "认证失败" }
  E0020: { category: ERROR, message: "无法登录" }
  # --- 不存在・业务异常・输入校验・文件 ---
  E0005: { category: ERROR, message: "未找到对象" }
  E0006: { category: ERROR, message: "当前状态下无法执行此操作" }
  E0007: { category: ERROR, message: "已存在" }
  E0008: { category: ERROR, message: "输入内容有误" }
  E0009: { category: ERROR, message: "不允许的文件格式" }
  E0010: { category: ERROR, message: "文件大小超过上限" }
  # --- 系统 ---
  E0012: { category: ERROR, message: "发生系统错误，请联系管理员" }
  E0013: { category: ERROR, message: "无法连接服务，请稍后再试" }
  # --- 客户端输入校验 ---
  E0030: { category: ERROR, message: "{0}为必填项" }
  E0031: { category: ERROR, message: "{0}的格式不正确" }
  E0032: { category: ERROR, message: "{0}请在{1}个字符以内输入" }
  E0033: { category: ERROR, message: "{0}请输入{1}以上的值" }
  E0034: { category: ERROR, message: "{0}请输入{1}以下的值" }
  # --- API Gateway ---
  E0040: { category: ERROR, message: "未提供认证令牌" }
  E0041: { category: ERROR, message: "认证令牌无效" }
  E0042: { category: ERROR, message: "请求的路由不存在" }
  E0043: { category: ERROR, message: "服务响应超时" }
