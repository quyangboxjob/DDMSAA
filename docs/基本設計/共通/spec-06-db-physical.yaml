  - id: TBL-users
    physical_name: users
    logical_name: ユーザ
    type: 業務
    description: "利用者。パスワードは保持しない（Magic Link 認証）"
    columns:
      - { logical: ユーザID, physical: user_id, type: varchar(10), pk: true, not_null: true, note: "業務キー。ロールに応じた prefix（A=ADMIN / E=EMPLOYEE / C=CUSTOMER）+4桁をアプリケーション層で採番。DEFAULT なし" }
      - { logical: 表示名, physical: user_name, type: varchar(100), not_null: true }
      - { logical: ロール, physical: role, type: int, fk: true, not_null: true, references: "user_role_codes.user_role_code", note: "参照: ロール（T07-1：1=ADMIN, 2=EMPLOYEE, 3=CUSTOMER）。" }
      - { logical: 状態, physical: status, type: int, fk: true, not_null: true, references: "user_status_codes.user_status_code", note: "参照: 利用者状態（T07-2：1=ACTIVE, 2=DISABLED）。" }
      - { logical: 顧客ID, physical: customer_id, type: varchar(10), fk: true, references: "customers.id", note: "CUSTOMER は必須、ADMIN / EMPLOYEE は NULL（chk_users_customer_id）" }
    indexes:
      - { name: pk_users, columns: [user_id], type: 主キー, purpose: 主キー }
      - { name: idx_users_customer_id, columns: [customer_id], type: 一般, purpose: 検索 }
      - { name: idx_users_role_status, columns: [role, status], type: 一般, purpose: 検索 }
      - { name: idx_users_status, columns: [status], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_users_user_role_codes, type: 外部キー, content: "role → user_role_codes.user_role_code" }
      - { name: fk_users_user_status_codes, type: 外部キー, content: "status → user_status_codes.user_status_code" }
      - { name: fk_users_customers, type: 外部キー, content: "customer_id → customers.id" }
      - { name: chk_users_customer_id, type: チェック, content: "(role = 3) = (customer_id IS NOT NULL)" }

  - id: TBL-user-contacts
    physical_name: user_contacts
    logical_name: ユーザ連絡先
    type: 業務
    description: "Magic Link・通知の送信先メール（users と 1:1）。users と同時に作成し、行は更新のみで削除しない"
    soft_delete: false            # no soft delete: users の 1:1 子（その場で更新）
    columns:
      - { logical: ユーザID, physical: user_id, type: varchar(10), pk: true, fk: true, not_null: true, references: "users.user_id", note: "共有主キー（§4.1-SHARED）" }
      - { logical: メールアドレス, physical: email, type: varchar(255), not_null: true, note: "全行で一意" }
    indexes:
      - { name: pk_user_contacts, columns: [user_id], type: 主キー, purpose: 主キー }
      - { name: uq_user_contacts_email, columns: [email], type: ユニーク, purpose: 一意性 }
    constraints:
      - { name: fk_user_contacts_users, type: 外部キー, content: "user_id → users.user_id" }

  - id: TBL-system-locks
    physical_name: system_locks
    logical_name: システムロック
    type: 業務
    description: "ADMIN による利用者ロック（users と 1:0..1）。ログイン可否判定に使用。解除は lock_started_at を NULL に更新し、行は削除しない"
    soft_delete: false            # no soft delete: users の 1:0..1 子（その場で更新）
    columns:
      - { logical: ユーザID, physical: user_id, type: varchar(10), pk: true, fk: true, not_null: true, references: "users.user_id", note: "共有主キー（§4.1-SHARED）" }
      - { logical: ロック開始日時, physical: lock_started_at, type: timestamptz, note: "NULL=ロックなし。ロック操作時の現在時刻を設定する（未来時刻は設定しない）" }
      - { logical: ロック理由, physical: lock_reason, type: varchar(500) }
    indexes:
      - { name: pk_system_locks, columns: [user_id], type: 主キー, purpose: 主キー }
    constraints:
      - { name: fk_system_locks_users, type: 外部キー, content: "user_id → users.user_id" }

  - id: TBL-customers
