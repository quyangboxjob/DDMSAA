    columns:
      - { logical: 担当割当ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('AS', 8)", note: "AS+8桁を採番" }
      - { logical: 顧客ID, physical: customer_id, type: varchar(10), fk: true, not_null: true, references: "customers.id" }
      - { logical: ユーザID, physical: user_id, type: varchar(10), fk: true, not_null: true, references: "users.user_id", note: "担当 EMPLOYEE" }
      - { logical: 有効フラグ, physical: is_active, type: boolean, not_null: true, default: "TRUE", note: "解除は FALSE にする（論理削除しない）。同じ顧客・社員を再割当するときは同じ行を TRUE に戻し、割当日を当日にする" }
      - { logical: 割当日, physical: assigned_date, type: date, not_null: true, default: "CURRENT_DATE" }
    indexes:
      - { name: pk_customer_assignments, columns: [id], type: 主キー, purpose: 主キー }
      - { name: uq_cus_asg_cus_id_user_id, columns: [customer_id, user_id], type: 部分ユニーク, where: "deleted_at IS NULL", purpose: 一意性（未削除行のみ） }
      - { name: idx_cus_asg_user_id_is_active, columns: [user_id, is_active], type: 一般, purpose: 検索 }
    constraints:
      - { name: fk_cus_asg_customers, type: 外部キー, content: "customer_id → customers.id" }
      - { name: fk_customer_assignments_users, type: 外部キー, content: "user_id → users.user_id" }

  - id: TBL-products
    physical_name: products
    logical_name: 商品
    type: マスタ
    description: "商品マスタ"
    id_prefix: PR
    id_width: 8
    columns:
      - { logical: 商品ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('PR', 8)", note: "PR+8桁を採番" }
      - { logical: 商品コード, physical: product_code, type: varchar(50), not_null: true, note: "未削除行で一意" }
      - { logical: 商品名, physical: product_name, type: varchar(200), not_null: true }
      - { logical: 商品カテゴリ, physical: product_category, type: varchar(100) }
      - { logical: 標準単価, physical: standard_unit_price, type: "numeric(15,2)", not_null: true, default: "0", note: "0 以上（chk_products_std_unit_price）" }
      - { logical: 税区分, physical: tax_category, type: int, fk: true, not_null: true, references: "tax_category_codes.tax_category_code", note: "参照: 税区分（T07-5：1=STANDARD, 2=REDUCED, 3=EXEMPT）。" }
      - { logical: 状態, physical: status, type: int, fk: true, not_null: true, references: "product_status_codes.product_status_code", note: "参照: 商品状態（T07-4：1=ACTIVE, 2=INACTIVE）。" }
    indexes:
      - { name: pk_products, columns: [id], type: 主キー, purpose: 主キー }
      - { name: uq_products_product_code, columns: [product_code], type: 部分ユニーク, where: "deleted_at IS NULL", purpose: 一意性（未削除行のみ） }
      - { name: idx_products_tax_category, columns: [tax_category], type: 一般, purpose: 外部キー（§6.2） }
      - { name: idx_products_status, columns: [status], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_products_tax_category_codes, type: 外部キー, content: "tax_category → tax_category_codes.tax_category_code" }
      - { name: fk_products_prd_sts_codes, type: 外部キー, content: "status → product_status_codes.product_status_code" }
      - { name: chk_products_std_unit_price, type: チェック, content: "standard_unit_price >= 0" }

  - id: TBL-tax-rates
    physical_name: tax_rates
    logical_name: 税率
    type: マスタ
    description: "税区分ごとの税率（§4.1-NATURAL）。注文時に明細へ複写する"
    columns:
      - { logical: 税区分, physical: tax_category, type: int, pk: true, fk: true, not_null: true, references: "tax_category_codes.tax_category_code", note: "参照: 税区分（T07-5：1=STANDARD, 2=REDUCED, 3=EXEMPT）。自然キー主キー" }
      - { logical: 税率, physical: tax_rate, type: "numeric(5,2)", not_null: true, default: "0", note: "0.00〜100.00（chk_tax_rates_tax_rate）" }
    indexes:
      - { name: pk_tax_rates, columns: [tax_category], type: 主キー, purpose: 主キー }
    constraints:
      - { name: fk_tax_rates_tax_cat_codes, type: 外部キー, content: "tax_category → tax_category_codes.tax_category_code" }
      - { name: chk_tax_rates_tax_rate, type: チェック, content: "tax_rate BETWEEN 0 AND 100" }

  - id: TBL-orders
    physical_name: orders
    logical_name: 注文
    type: 業務
    description: "注文ヘッダ。注文番号は id とする"
    id_prefix: OD
    id_width: 8
    columns:
      - { logical: 注文ID（注文番号）, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('OD', 8)", note: "OD+8桁を採番" }
      - { logical: 顧客ID, physical: customer_id, type: varchar(10), fk: true, not_null: true, references: "customers.id" }
      - { logical: 担当者ユーザID, physical: sales_user_id, type: varchar(10), fk: true, not_null: true, references: "users.user_id", note: "注文顧客の担当 EMPLOYEE（BR-ORD-008）" }
      - { logical: 注文日, physical: order_date, type: date, not_null: true }
      - { logical: 状態, physical: status, type: int, fk: true, not_null: true, references: "order_status_codes.order_status_code", note: "参照: 注文状態（T07-6：1=DRAFT, 2=PENDING_APPROVAL, 3=RETURNED, 4=APPROVED, 5=CANCELLED）。" }
      - { logical: 小計, physical: subtotal_amount, type: "numeric(15,2)", not_null: true, default: "0", note: "サーバー再計算値" }
      - { logical: 税額, physical: tax_amount, type: "numeric(15,2)", not_null: true, default: "0", note: "サーバー再計算値" }
      - { logical: 合計, physical: total_amount, type: "numeric(15,2)", not_null: true, default: "0", note: "サーバー再計算値" }
      - { logical: 訂正元注文ID, physical: revised_from_order_id, type: varchar(10), fk: true, references: "orders.id", note: "取消済み（CANCELLED）・同一顧客の元注文。新規作成時のみ設定し、1 注文につき訂正は 1 回（uq_orders_revised_from、BR-ORD-009）" }
      - { logical: 取消し理由, physical: cancel_reason, type: varchar(500), note: "CANCELLED のとき必須（chk_orders_cancel_reason）" }
    indexes:
      - { name: pk_orders, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_orders_cus_id_order_date, columns: [customer_id, order_date], type: 一般, purpose: 検索 }
      - { name: idx_orders_sales_user_status, columns: [sales_user_id, status], type: 一般, purpose: 検索 }
      - { name: idx_orders_status_order_date, columns: [status, order_date], type: 一般, purpose: 検索 }
      - { name: uq_orders_revised_from, columns: [revised_from_order_id], type: 部分ユニーク, where: "revised_from_order_id IS NOT NULL AND deleted_at IS NULL", purpose: 一意性（訂正は 1 回） }
    constraints:
      - { name: fk_orders_customers, type: 外部キー, content: "customer_id → customers.id" }
      - { name: fk_orders_users, type: 外部キー, content: "sales_user_id → users.user_id" }
      - { name: fk_orders_order_status_codes, type: 外部キー, content: "status → order_status_codes.order_status_code" }
      - { name: fk_orders_orders, type: 外部キー, content: "revised_from_order_id → orders.id" }
      - { name: chk_orders_cancel_reason, type: チェック, content: "status <> 5 OR cancel_reason IS NOT NULL" }

  - id: TBL-order-items
    physical_name: order_items
    logical_name: 注文明細
    type: 業務
    description: "注文明細。商品・税率は注文時点で複写する"
    id_prefix: OI
    id_width: 8
    columns:
      - { logical: 注文明細ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('OI', 8)", note: "OI+8桁を採番" }
      - { logical: 注文ID, physical: order_id, type: varchar(10), fk: true, not_null: true, references: "orders.id" }
      - { logical: 行番号, physical: line_number, type: numeric, not_null: true, default: "0" }
      - { logical: 商品ID, physical: product_id, type: varchar(10), fk: true, not_null: true, references: "products.id" }
      - { logical: 商品コード（複写）, physical: product_code, type: varchar(50), not_null: true }
      - { logical: 商品名（複写）, physical: product_name, type: varchar(200), not_null: true }
      - { logical: 数量, physical: quantity, type: "numeric(15,3)", not_null: true, default: "0", note: "0 より大きい（chk_order_items_quantity）" }
      - { logical: 単価, physical: unit_price, type: "numeric(15,2)", not_null: true, default: "0", note: "商品の standard_unit_price の複写（保存・申請時。BR-PRD-002）。0 以上（chk_order_items_unit_price）" }
      - { logical: 税区分（複写）, physical: tax_category, type: int, fk: true, not_null: true, references: "tax_category_codes.tax_category_code", note: "参照: 税区分（T07-5：1=STANDARD, 2=REDUCED, 3=EXEMPT）。" }
      - { logical: 税率（複写）, physical: tax_rate, type: "numeric(5,2)", not_null: true, default: "0" }
      - { logical: 明細金額, physical: line_amount, type: "numeric(15,2)", not_null: true, default: "0", note: "quantity × unit_price" }
      - { logical: 明細税額, physical: tax_amount, type: "numeric(15,2)", not_null: true, default: "0", note: "HALF_UP(line_amount × tax_rate / 100)" }
    indexes:
      - { name: pk_order_items, columns: [id], type: 主キー, purpose: 主キー }
      - { name: uq_order_items_order_line_no, columns: [order_id, line_number], type: 部分ユニーク, where: "deleted_at IS NULL", purpose: 一意性（未削除行のみ） }
      - { name: idx_order_items_product_id, columns: [product_id], type: 一般, purpose: 検索 }
      - { name: idx_order_items_tax_category, columns: [tax_category], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_order_items_orders, type: 外部キー, content: "order_id → orders.id" }
      - { name: fk_order_items_products, type: 外部キー, content: "product_id → products.id" }
      - { name: fk_order_items_tax_cat_codes, type: 外部キー, content: "tax_category → tax_category_codes.tax_category_code" }
      - { name: chk_order_items_quantity, type: チェック, content: "quantity > 0" }
      - { name: chk_order_items_unit_price, type: チェック, content: "unit_price >= 0" }

  - id: TBL-order-status-histories
    physical_name: order_status_histories
    logical_name: 注文状態履歴
    type: 履歴
    description: "注文状態の遷移履歴（追加専用）。変更者・日時は created_by / created_at"
    id_prefix: OH
    id_width: 8
    soft_delete: false            # no soft delete: 履歴テーブル
    columns:
      - { logical: 注文状態履歴ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('OH', 8)", note: "OH+8桁を採番" }
      - { logical: 注文ID, physical: order_id, type: varchar(10), fk: true, not_null: true, references: "orders.id" }
      - { logical: 変更前状態, physical: from_status, type: int, fk: true, references: "order_status_codes.order_status_code", note: "参照: 注文状態（T07-6：1=DRAFT, 2=PENDING_APPROVAL, 3=RETURNED, 4=APPROVED, 5=CANCELLED）。新規作成時は NULL" }
      - { logical: 変更後状態, physical: to_status, type: int, fk: true, not_null: true, references: "order_status_codes.order_status_code", note: "参照: 注文状態（T07-6：1=DRAFT, 2=PENDING_APPROVAL, 3=RETURNED, 4=APPROVED, 5=CANCELLED）。" }
      - { logical: 理由, physical: reason, type: varchar(500), note: "取消し・差戻しの理由（CUSTOMER には返さない。BR-APR-006）" }
    indexes:
      - { name: pk_order_status_histories, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_ord_sts_hist_order_created, columns: [order_id, created_at], type: 一般, purpose: 検索 }
      - { name: idx_ord_sts_hist_from_status, columns: [from_status], type: 一般, purpose: 外部キー（§6.2） }
      - { name: idx_ord_sts_hist_to_status, columns: [to_status], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_ord_sts_hist_orders, type: 外部キー, content: "order_id → orders.id" }
      - { name: fk_ord_sts_hist_from_status, type: 外部キー, content: "from_status → order_status_codes.order_status_code" }
      - { name: fk_ord_sts_hist_to_status, type: 外部キー, content: "to_status → order_status_codes.order_status_code" }

  - id: TBL-approval-rules
    physical_name: approval_rules
    logical_name: 承認ルール
    type: マスタ
    description: "承認経路。初版は 0〜上限なし・1 段・ADMIN の 1 行のみ（BR-APR-001）。承認者は特定しない（有効な ADMIN のうち申請者以外）"
    id_prefix: AR
    id_width: 8
    columns:
      - { logical: 承認ルールID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('AR', 8)", note: "AR+8桁を採番" }
      - { logical: 金額下限, physical: min_amount, type: "numeric(15,2)", not_null: true, default: "0" }
      - { logical: 金額上限, physical: max_amount, type: "numeric(15,2)", note: "NULL=上限なし" }
      - { logical: 承認段階, physical: approval_step, type: numeric, not_null: true, default: "1" }
      - { logical: 承認者ロール, physical: approver_role, type: int, fk: true, not_null: true, references: "user_role_codes.user_role_code", note: "参照: ロール（T07-1：1=ADMIN, 2=EMPLOYEE, 3=CUSTOMER）。初版は 1=ADMIN 固定（chk_apr_rules_approver_role）" }
      - { logical: 有効フラグ, physical: is_active, type: boolean, not_null: true, default: "TRUE" }
      - { logical: 適用開始日, physical: effective_from_date, type: date, not_null: true }
      - { logical: 適用終了日, physical: effective_to_date, type: date }
    indexes:
      - { name: pk_approval_rules, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_apr_rules_active_eff_from, columns: [is_active, effective_from_date], type: 一般, purpose: 検索 }
      - { name: idx_apr_rules_approver_role, columns: [approver_role], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_apr_rules_user_role_codes, type: 外部キー, content: "approver_role → user_role_codes.user_role_code" }
      - { name: chk_apr_rules_approver_role, type: チェック, content: "approver_role = 1" }
      - { name: chk_approval_rules_max_amount, type: チェック, content: "max_amount IS NULL OR max_amount >= min_amount" }
      - { name: chk_apr_rules_eff_to_date, type: チェック, content: "effective_to_date IS NULL OR effective_to_date >= effective_from_date" }
      - { name: chk_apr_rules_approver_role, type: チェック, content: "approver_role = 1" }
      - { name: chk_approval_rules_max_amount, type: チェック, content: "max_amount IS NULL OR max_amount >= min_amount" }
      - { name: chk_apr_rules_eff_to_date, type: チェック, content: "effective_to_date IS NULL OR effective_to_date >= effective_from_date" }

  - id: TBL-approval-requests
    physical_name: approval_requests
    logical_name: 承認依頼
    type: 業務
    description: "注文ごとの承認依頼と適用ルールのスナップショット。再申請ごとに新しい行を作る"
    id_prefix: AQ
    id_width: 8
    columns:
      - { logical: 承認依頼ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('AQ', 8)", note: "AQ+8桁を採番" }
      - { logical: 注文ID, physical: order_id, type: varchar(10), fk: true, not_null: true, references: "orders.id" }
      - { logical: 承認段階, physical: approval_step, type: numeric, not_null: true, default: "1" }
      - { logical: 承認者ユーザID, physical: approver_user_id, type: varchar(10), fk: true, references: "users.user_id", note: "実際に承認・差戻しした ADMIN。申請時は NULL。申請者（created_by）とは異なる（BR-APR-002）" }
      - { logical: ルールスナップショット, physical: rule_snapshot, type: jsonb, not_null: true, note: "申請時点の approval_rules の複写。申請者は created_by" }
      - { logical: 状態, physical: status, type: int, fk: true, not_null: true, references: "approval_request_status_codes.approval_request_status_code", note: "参照: 承認依頼状態（T07-7：1=PENDING, 2=APPROVED, 3=RETURNED）。" }
      - { logical: 処理日時, physical: acted_at, type: timestamptz }
    indexes:
      - { name: pk_approval_requests, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_apr_req_order_id_status, columns: [order_id, status], type: 一般, purpose: 検索 }
      - { name: idx_apr_req_approver_status, columns: [approver_user_id, status], type: 一般, purpose: 検索 }
      - { name: idx_approval_requests_status, columns: [status], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_approval_requests_orders, type: 外部キー, content: "order_id → orders.id" }
      - { name: fk_approval_requests_users, type: 外部キー, content: "approver_user_id → users.user_id" }
      - { name: fk_apr_req_apr_req_sts_codes, type: 外部キー, content: "status → approval_request_status_codes.approval_request_status_code" }

  - id: TBL-approval-histories
    physical_name: approval_histories
    logical_name: 承認履歴
    type: 履歴
    description: "承認・差戻しの操作履歴（追加専用）。操作者・日時は created_by / created_at"
    id_prefix: AH
    id_width: 8
    soft_delete: false            # no soft delete: 履歴テーブル
    columns:
      - { logical: 承認履歴ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('AH', 8)", note: "AH+8桁を採番" }
      - { logical: 承認依頼ID, physical: approval_request_id, type: varchar(10), fk: true, not_null: true, references: "approval_requests.id" }
      - { logical: 操作, physical: approval_action, type: int, fk: true, not_null: true, references: "approval_action_codes.approval_action_code", note: "参照: 承認操作（T07-8：1=APPROVE, 2=RETURN）。" }
      - { logical: 理由, physical: reason, type: varchar(500), note: "差戻し時は必須（1〜500 文字）" }
    indexes:
      - { name: pk_approval_histories, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_apr_hist_apr_request_id, columns: [approval_request_id], type: 一般, purpose: 検索 }
      - { name: idx_apr_hist_apr_action, columns: [approval_action], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_apr_hist_apr_requests, type: 外部キー, content: "approval_request_id → approval_requests.id" }
      - { name: fk_apr_hist_apr_action_codes, type: 外部キー, content: "approval_action → approval_action_codes.approval_action_code" }
      - { name: chk_approval_histories_reason, type: チェック, content: "approval_action <> 2 OR reason IS NOT NULL" }

  - id: TBL-order-attachments
    physical_name: order_attachments
    logical_name: 注文添付
    type: 業務
    description: "注文添付のメタデータ。ファイル本体はオブジェクトストレージ"
    id_prefix: AT
    id_width: 8
    columns:
      - { logical: 添付ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('AT', 8)", note: "AT+8桁を採番" }
      - { logical: 注文ID, physical: order_id, type: varchar(10), fk: true, not_null: true, references: "orders.id" }
      - { logical: 元ファイル名, physical: original_file_name, type: varchar(255), not_null: true }
      - { logical: 保存パス, physical: storage_path, type: varchar(512), not_null: true, note: "オブジェクトストレージのキー。利用者へ返さない" }
      - { logical: コンテンツタイプ, physical: content_type, type: varchar(100), not_null: true }
      - { logical: ファイルサイズ, physical: file_size, type: numeric, not_null: true, default: "0", note: "バイト。1〜10485760（chk_ord_atts_file_size）" }
      - { logical: 公開範囲, physical: visibility, type: int, fk: true, not_null: true, references: "attachment_visibility_codes.attachment_visibility_code", note: "参照: 添付公開範囲（T07-9：1=INTERNAL, 2=CUSTOMER）。" }
      - { logical: スキャン状態, physical: scan_status, type: int, fk: true, not_null: true, references: "scan_status_codes.scan_status_code", note: "参照: スキャン状態（T07-10：1=PENDING, 2=SAFE, 3=REJECTED）。" }
      - { logical: ファイル削除日時, physical: storage_purged_at, type: timestamptz, note: "ストレージ上のファイルを削除した日時（BAT-04）。NULL=未削除" }
    indexes:
      - { name: pk_order_attachments, columns: [id], type: 主キー, purpose: 主キー }
      - { name: uq_ord_atts_storage_path, columns: [storage_path], type: 部分ユニーク, where: "deleted_at IS NULL", purpose: 一意性（未削除行のみ） }
      - { name: idx_ord_atts_order_vis_scan, columns: [order_id, visibility, scan_status], type: 一般, purpose: 検索 }
      - { name: idx_ord_atts_visibility, columns: [visibility], type: 一般, purpose: 外部キー（§6.2） }
      - { name: idx_ord_atts_scan_status, columns: [scan_status], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_order_attachments_orders, type: 外部キー, content: "order_id → orders.id" }
      - { name: fk_ord_atts_att_vis_codes, type: 外部キー, content: "visibility → attachment_visibility_codes.attachment_visibility_code" }
      - { name: fk_ord_atts_scan_sts_codes, type: 外部キー, content: "scan_status → scan_status_codes.scan_status_code" }
      - { name: chk_ord_atts_file_size, type: チェック, content: "file_size > 0 AND file_size <= 10485760" }

  - id: TBL-export-jobs
    physical_name: export_jobs
    logical_name: CSV 出力ジョブ
    type: 業務
    description: "CSV 出力ジョブ（全件を記録。10,000 件以下は同期生成して READY、10,001 件以上は QUEUED で非同期生成。BR-RPT-002）。依頼者は created_by"
    id_prefix: EJ
    id_width: 8
    columns:
      - { logical: 出力ジョブID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('EJ', 8)", note: "EJ+8桁を採番" }
      - { logical: 抽出条件, physical: filter_condition, type: jsonb, not_null: true }
      - { logical: 状態, physical: status, type: int, fk: true, not_null: true, references: "export_status_codes.export_status_code", note: "参照: 出力状態（T07-13：1=QUEUED, 2=RUNNING, 3=READY, 4=FAILED, 5=EXPIRED）。" }
      - { logical: 保存パス, physical: storage_path, type: varchar(512) }
      - { logical: 件数, physical: record_count, type: numeric, not_null: true, default: "0" }
      - { logical: 有効期限, physical: expires_at, type: timestamptz, note: "完了から 24 時間。経過後は BAT-03 が EXPIRED にする" }
      - { logical: エラー内容, physical: error_message, type: text }
      - { logical: 完了日時, physical: completed_at, type: timestamptz }
      - { logical: ファイル削除日時, physical: storage_purged_at, type: timestamptz, note: "ストレージ上のファイルを削除した日時（BAT-03）。NULL=未削除" }
    indexes:
      - { name: pk_export_jobs, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_export_jobs_creator_status, columns: [created_by, status], type: 一般, purpose: 検索 }
      - { name: idx_export_jobs_status, columns: [status], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_export_jobs_exp_sts_codes, type: 外部キー, content: "status → export_status_codes.export_status_code" }

  - id: TBL-notification-logs
    physical_name: notification_logs
    logical_name: 通知ログ
    type: 業務
    description: "業務メール通知のアウトボックスと送信履歴（Magic Link は auth-service が送信し、ここには記録しない）"
    id_prefix: NL
    id_width: 8
    columns:
      - { logical: 通知ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('NL', 8)", note: "NL+8桁を採番" }
      - { logical: 通知イベント, physical: notification_event, type: int, fk: true, not_null: true, references: "notification_event_codes.notification_event_code", note: "参照: 通知イベント（T07-11：1=ORDER_SUBMITTED, 2=ORDER_APPROVED, 3=ORDER_RETURNED, 4=ORDER_CANCELLED, 5=EXPORT_COMPLETED）。" }
      - { logical: 注文ID, physical: order_id, type: varchar(10), fk: true, references: "orders.id" }
      - { logical: 宛先メール, physical: recipient_email, type: varchar(255), not_null: true }
      - { logical: 状態, physical: status, type: int, fk: true, not_null: true, references: "notification_status_codes.notification_status_code", note: "参照: 通知状態（T07-12：1=QUEUED, 2=SENDING, 3=SENT, 4=FAILED）。再試行待ちは QUEUED のまま、最終失敗だけ FAILED" }
      - { logical: 出力ジョブID, physical: export_job_id, type: varchar(10), fk: true, references: "export_jobs.id", note: "出力完了通知（EXPORT_COMPLETED）の対象ジョブ。それ以外は NULL" }
      - { logical: 試行回数, physical: attempt_count, type: numeric, not_null: true, default: "0", note: "送信を試みた回数（初回を含む。最大 4 回＝初回＋再試行 3 回。手動再送で 0 に戻す。BR-NTF-002）" }
      - { logical: 次回送信日時, physical: next_attempt_at, type: timestamptz, note: "次回送信予定日時。QUEUED のとき送信ワーカーが `next_attempt_at <= 現在` の行を処理する（BR-NTF-002）" }
      - { logical: エラー内容, physical: error_message, type: text }
      - { logical: 送信日時, physical: sent_at, type: timestamptz }
    indexes:
      - { name: pk_notification_logs, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_ntf_logs_status_created, columns: [status, created_at], type: 一般, purpose: 検索 }
      - { name: idx_ntf_logs_status_next_try, columns: [status, next_attempt_at], type: 一般, purpose: 送信ワーカーの抽出 }
      - { name: idx_notification_logs_order_id, columns: [order_id], type: 一般, purpose: 検索 }
      - { name: idx_ntf_logs_export_job_id, columns: [export_job_id], type: 一般, purpose: 外部キー（§6.2） }
      - { name: idx_ntf_logs_ntf_event, columns: [notification_event], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_ntf_logs_ntf_evt_codes, type: 外部キー, content: "notification_event → notification_event_codes.notification_event_code" }
      - { name: fk_notification_logs_orders, type: 外部キー, content: "order_id → orders.id" }
      - { name: fk_ntf_logs_export_jobs, type: 外部キー, content: "export_job_id → export_jobs.id" }
      - { name: fk_ntf_logs_ntf_sts_codes, type: 外部キー, content: "status → notification_status_codes.notification_status_code" }

  - id: TBL-audit-logs
    physical_name: audit_logs
    logical_name: 監査ログ
    type: 業務
    description: "重要操作の監査ログ（追加専用。論理削除は運用上行わない）"
    id_prefix: AL
    id_width: 8
    columns:
      - { logical: 監査ログID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('AL', 8)", note: "AL+8桁を採番" }
      - { logical: 操作者ユーザID, physical: actor_user_id, type: varchar(10), fk: true, references: "users.user_id", note: "未認証の操作は NULL" }
      - { logical: 操作, physical: audit_action, type: varchar(100), not_null: true }
      - { logical: 対象種別, physical: target_type, type: varchar(100), not_null: true }
      - { logical: 対象ID, physical: target_id, type: varchar(100) }
      - { logical: トレースID, physical: trace_id, type: varchar(100) }
      - { logical: IP アドレス, physical: ip_address, type: varchar(45) }
      - { logical: 監査詳細, physical: audit_detail, type: jsonb, note: "メール本文・ファイル本体・Magic Link token を含めない" }
    indexes:
      - { name: pk_audit_logs, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_audit_logs_actor_created, columns: [actor_user_id, created_at], type: 一般, purpose: 検索 }
      - { name: idx_audit_logs_tgt_type_id, columns: [target_type, target_id], type: 一般, purpose: 検索 }
    constraints:
      - { name: fk_audit_logs_users, type: 外部キー, content: "actor_user_id → users.user_id" }

