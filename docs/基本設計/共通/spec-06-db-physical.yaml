meta:
  system: DDMSAA
  dbms: PostgreSQL 16
  version: 1.0
  charset: UTF-8
  timezone: Asia/Tokyo
  authority: このファイルが DDMSAA の物理 DB 定義の唯一の正とする。
conventions:
  primary_key: uuid
  timestamps: [created_at, updated_at]
  soft_delete: deleted_at
  money: numeric(15,2)
  optimistic_lock: version bigint
enums:
  role_code: [ADMIN, EMPLOYEE, CUSTOMER]
  user_status: [ACTIVE, DISABLED, LOCKED]
  order_status: [DRAFT, PENDING_APPROVAL, RETURNED, APPROVED, CANCELLED]
  attachment_visibility: [INTERNAL, CUSTOMER]
  scan_status: [PENDING, SAFE, REJECTED]
  notification_status: [QUEUED, SENDING, SENT, FAILED]
  export_status: [QUEUED, RUNNING, READY, FAILED, EXPIRED]
tables:
  - name: tax_categories
    purpose: 税率マスタ。注文時に税率を明細へスナップショットする。
    columns:
      - { name: tax_category_code, type: varchar(20), pk: true }
      - { name: display_name, type: varchar(100), not_null: true }
      - { name: rate, type: numeric(5,2), not_null: true, check: 'rate >= 0 and rate <= 100' }
      - { name: active, type: boolean, not_null: true, default: true }
    seed: [{ code: STANDARD, rate: 10.00 }, { code: REDUCED, rate: 8.00 }, { code: EXEMPT, rate: 0.00 }]
  - name: customers
    purpose: 顧客マスタ
    columns:
      - { name: customer_id, type: uuid, pk: true }
      - { name: customer_code, type: varchar(30), not_null: true, unique: true }
      - { name: customer_name, type: varchar(200), not_null: true }
      - { name: email, type: varchar(255) }
      - { name: phone, type: varchar(50) }
      - { name: status, type: varchar(20), not_null: true, default: ACTIVE }
      - { name: created_at, type: timestamptz, not_null: true }
      - { name: updated_at, type: timestamptz, not_null: true }
      - { name: deleted_at, type: timestamptz }
  - name: customer_contacts
    purpose: 顧客連絡先
    columns:
      - { name: customer_contact_id, type: uuid, pk: true }
      - { name: customer_id, type: uuid, fk: 'customers.customer_id', not_null: true }
      - { name: contact_name, type: varchar(100), not_null: true }
      - { name: email, type: varchar(255), not_null: true }
      - { name: is_notification_recipient, type: boolean, not_null: true, default: false }
      - { name: active, type: boolean, not_null: true, default: true }
    indexes: [{ columns: [customer_id, active] }]
  - name: users
    purpose: 利用者。パスワード本文は保存しない。
    columns:
      - { name: user_id, type: uuid, pk: true }
      - { name: login_id, type: varchar(100), not_null: true, unique: true }
      - { name: display_name, type: varchar(100), not_null: true }
      - { name: email, type: varchar(255), not_null: true, unique: true }
      - { name: password_hash, type: varchar(255), not_null: true, note: BCrypt hash only }
      - { name: role_code, type: varchar(20), not_null: true, check: 'ADMIN|EMPLOYEE|CUSTOMER' }
      - { name: customer_id, type: uuid, fk: 'customers.customer_id', note: CUSTOMER のみ必須 }
      - { name: status, type: varchar(20), not_null: true, default: ACTIVE }
      - { name: failed_login_count, type: integer, not_null: true, default: 0 }
      - { name: locked_until, type: timestamptz }
      - { name: created_at, type: timestamptz, not_null: true }
      - { name: updated_at, type: timestamptz, not_null: true }
      - { name: deleted_at, type: timestamptz }
    checks: ['(role_code <> ''CUSTOMER'' or customer_id is not null)']
    indexes: [{ columns: [customer_id] }, { columns: [role_code, status] }]
  - name: user_sessions
    purpose: HttpOnly セッション Cookie のハッシュと失効管理
    columns:
      - { name: session_id, type: uuid, pk: true }
      - { name: user_id, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: token_hash, type: varchar(255), not_null: true, unique: true }
      - { name: expires_at, type: timestamptz, not_null: true }
      - { name: revoked_at, type: timestamptz }
      - { name: created_at, type: timestamptz, not_null: true }
    indexes: [{ columns: [user_id, expires_at] }]
  - name: employee_customer_assignments
    purpose: EMPLOYEE と担当顧客の多対多割当
    columns:
      - { name: assignment_id, type: uuid, pk: true }
      - { name: employee_user_id, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: customer_id, type: uuid, fk: 'customers.customer_id', not_null: true }
      - { name: active, type: boolean, not_null: true, default: true }
      - { name: assigned_at, type: timestamptz, not_null: true }
    constraints: [{ unique: [employee_user_id, customer_id] }]
  - name: products
    purpose: 商品マスタ
    columns:
      - { name: product_id, type: uuid, pk: true }
      - { name: product_code, type: varchar(50), not_null: true, unique: true }
      - { name: product_name, type: varchar(200), not_null: true }
      - { name: category, type: varchar(100) }
      - { name: standard_unit_price, type: numeric(15,2), not_null: true, check: 'standard_unit_price >= 0' }
      - { name: tax_category_code, type: varchar(20), fk: 'tax_categories.tax_category_code', not_null: true }
      - { name: status, type: varchar(20), not_null: true, default: ACTIVE }
      - { name: created_at, type: timestamptz, not_null: true }
      - { name: updated_at, type: timestamptz, not_null: true }
      - { name: deleted_at, type: timestamptz }
  - name: orders
    purpose: 注文ヘッダ
    columns:
      - { name: order_id, type: uuid, pk: true }
      - { name: order_number, type: varchar(30), not_null: true, unique: true }
      - { name: customer_id, type: uuid, fk: 'customers.customer_id', not_null: true }
      - { name: sales_user_id, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: order_date, type: date, not_null: true }
      - { name: status, type: varchar(30), not_null: true, default: DRAFT }
      - { name: subtotal_amount, type: numeric(15,2), not_null: true }
      - { name: tax_amount, type: numeric(15,2), not_null: true }
      - { name: total_amount, type: numeric(15,2), not_null: true }
      - { name: version, type: bigint, not_null: true, default: 1 }
      - { name: revised_from_order_id, type: uuid, fk: 'orders.order_id', note: '取消済み注文を訂正して作り直す場合の元注文。初版では任意。' }
      - { name: cancel_reason, type: varchar(500) }
      - { name: created_at, type: timestamptz, not_null: true }
      - { name: updated_at, type: timestamptz, not_null: true }
    indexes: [{ columns: [customer_id, order_date] }, { columns: [sales_user_id, status] }, { columns: [status, order_date] }]
  - name: order_items
    purpose: 注文明細。商品・税率を注文時点でスナップショットする。
    columns:
      - { name: order_item_id, type: uuid, pk: true }
      - { name: order_id, type: uuid, fk: 'orders.order_id', not_null: true }
      - { name: line_no, type: integer, not_null: true }
      - { name: product_id, type: uuid, fk: 'products.product_id', not_null: true }
      - { name: product_code_snapshot, type: varchar(50), not_null: true }
      - { name: product_name_snapshot, type: varchar(200), not_null: true }
      - { name: quantity, type: numeric(15,3), not_null: true, check: 'quantity > 0' }
      - { name: unit_price, type: numeric(15,2), not_null: true, check: 'unit_price >= 0' }
      - { name: tax_category_code, type: varchar(20), not_null: true }
      - { name: tax_rate, type: numeric(5,2), not_null: true }
      - { name: line_amount, type: numeric(15,2), not_null: true }
      - { name: tax_amount, type: numeric(15,2), not_null: true }
    constraints: [{ unique: [order_id, line_no] }]
  - name: order_status_histories
    purpose: 注文状態履歴（追加専用）
    columns:
      - { name: order_status_history_id, type: uuid, pk: true }
      - { name: order_id, type: uuid, fk: 'orders.order_id', not_null: true }
      - { name: from_status, type: varchar(30) }
      - { name: to_status, type: varchar(30), not_null: true }
      - { name: reason, type: varchar(500) }
      - { name: changed_by, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: changed_at, type: timestamptz, not_null: true }
    indexes: [{ columns: [order_id, changed_at] }]
  - name: approval_rules
    purpose: 将来の承認依頼に適用する金額帯ルール
    columns:
      - { name: approval_rule_id, type: uuid, pk: true }
      - { name: amount_from, type: numeric(15,2), not_null: true }
      - { name: amount_to, type: numeric(15,2), note: null は上限なし }
      - { name: sequence, type: integer, not_null: true }
      - { name: approver_role_code, type: varchar(20), not_null: true, default: ADMIN }
      - { name: approver_user_id, type: uuid, fk: 'users.user_id' }
      - { name: active, type: boolean, not_null: true, default: true }
      - { name: effective_from, type: date, not_null: true }
      - { name: effective_to, type: date }
    seed: [{ amount_from: 0, amount_to: null, sequence: 1, approver_role_code: ADMIN }]
  - name: approval_requests
    purpose: 注文ごとの承認依頼と適用ルールのスナップショット
    columns:
      - { name: approval_request_id, type: uuid, pk: true }
      - { name: order_id, type: uuid, fk: 'orders.order_id', not_null: true }
      - { name: sequence, type: integer, not_null: true }
      - { name: approver_user_id, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: rule_snapshot, type: jsonb, not_null: true }
      - { name: status, type: varchar(20), not_null: true, default: PENDING }
      - { name: requested_by, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: requested_at, type: timestamptz, not_null: true }
      - { name: acted_at, type: timestamptz }
    constraints: [{ unique: [order_id, sequence] }]
  - name: approval_actions
    purpose: 承認・差戻し履歴（追加専用）
    columns:
      - { name: approval_action_id, type: uuid, pk: true }
      - { name: approval_request_id, type: uuid, fk: 'approval_requests.approval_request_id', not_null: true }
      - { name: action, type: varchar(20), not_null: true, check: 'APPROVED|RETURNED' }
      - { name: comment, type: varchar(500) }
      - { name: acted_by, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: acted_at, type: timestamptz, not_null: true }
  - name: order_attachments
    purpose: 注文添付のメタデータ。ファイル本体は認可済みストレージに置く。
    columns:
      - { name: attachment_id, type: uuid, pk: true }
      - { name: order_id, type: uuid, fk: 'orders.order_id', not_null: true }
      - { name: original_file_name, type: varchar(255), not_null: true }
      - { name: storage_key, type: varchar(500), not_null: true, unique: true }
      - { name: content_type, type: varchar(100), not_null: true }
      - { name: size_bytes, type: bigint, not_null: true, check: 'size_bytes > 0 and size_bytes <= 10485760' }
      - { name: visibility, type: varchar(20), not_null: true, default: INTERNAL }
      - { name: scan_status, type: varchar(20), not_null: true, default: PENDING }
      - { name: uploaded_by, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: uploaded_at, type: timestamptz, not_null: true }
      - { name: deleted_at, type: timestamptz }
    indexes: [{ columns: [order_id, visibility, scan_status] }]
  - name: notification_logs
    purpose: メール通知のアウトボックスと送信履歴
    columns:
      - { name: notification_id, type: uuid, pk: true }
      - { name: event_type, type: varchar(40), not_null: true }
      - { name: order_id, type: uuid, fk: 'orders.order_id' }
      - { name: recipient_email, type: varchar(255), not_null: true }
      - { name: status, type: varchar(20), not_null: true, default: QUEUED }
      - { name: attempt_count, type: integer, not_null: true, default: 0 }
      - { name: last_error, type: varchar(1000) }
      - { name: sent_at, type: timestamptz }
      - { name: created_at, type: timestamptz, not_null: true }
    indexes: [{ columns: [status, created_at] }]
  - name: export_jobs
    purpose: 大量 CSV の非同期出力ジョブ
    columns:
      - { name: export_job_id, type: uuid, pk: true }
      - { name: requested_by, type: uuid, fk: 'users.user_id', not_null: true }
      - { name: filter_snapshot, type: jsonb, not_null: true }
      - { name: status, type: varchar(20), not_null: true, default: QUEUED }
      - { name: storage_key, type: varchar(500) }
      - { name: record_count, type: integer }
      - { name: expires_at, type: timestamptz }
      - { name: error_message, type: varchar(1000) }
      - { name: created_at, type: timestamptz, not_null: true }
      - { name: completed_at, type: timestamptz }
  - name: audit_logs
    purpose: 重要操作の監査ログ（追加専用）
    columns:
      - { name: audit_log_id, type: uuid, pk: true }
      - { name: actor_user_id, type: uuid, fk: 'users.user_id' }
      - { name: action, type: varchar(100), not_null: true }
      - { name: target_type, type: varchar(100), not_null: true }
      - { name: target_id, type: varchar(100) }
      - { name: occurred_at, type: timestamptz, not_null: true }
      - { name: request_id, type: varchar(100) }
      - { name: detail, type: jsonb, note: パスワード・ファイル本体を含めない }
    indexes: [{ columns: [actor_user_id, occurred_at] }, { columns: [target_type, target_id] }]
