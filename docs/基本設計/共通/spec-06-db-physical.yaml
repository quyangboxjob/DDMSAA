# =====================================================================
# 06 DB 物理設計（YAML データソース）
# ---------------------------------------------------------------------
# 用途：テーブル・項目・インデックス・制約の機械可読な定義。スクリプトで DDL / エンティティクラス / ER 図を生成できる。
# 使い方：本ファイルを複製 → 例を置換 → 必要に応じて tables 配下のテーブルを増減する。
#       spec-06-db-physical-ui.md と対で用いる（md は ER 図と説明、yaml はデータソース）。
# 注意：YAML のインデントはスペースのみ（タブ不可）。同じ階層は揃えること。
# 規約：type には DBMS の実際の型を用いる。pk/fk/not_null は省略時 false。
# =====================================================================

meta:
  system: "DDMSAA"
  dbms: PostgreSQL
  version: "16"
  charset: UTF-8
  timezone: Asia/Tokyo

# ---------------------------------------------------------------------
# conventions：共通規約。すべての業務テーブルで common_columns を統一して付与する（履歴テーブル・コードテーブルは deleted_at を省略）。
# ---------------------------------------------------------------------
conventions:
  naming: snake_case             # テーブル名・列名の命名スタイル（開発規約/spec-naming-rule.md に従う）
  boolean_prefix: is_            # 真偽値列のプレフィックス（例：is_active）
  timestamp_suffix: _at          # 日時列のサフィックス（例：created_at）
  enum_storage: INT + コードテーブル FK   # 開発規約/spec-database-rule.md §4.1-CODE に従う
  encrypted_type: varchar(512)   # 暗号化列（アプリケーション層で暗号化）の型
  pk_strategy: 開発規約/spec-database-rule.md §4.1 に従う   # テーブルごとの実際の主キーは tables の定義を正とする
  common_columns:                # 各テーブルに共通で追加する列（deleted_at は履歴・コードテーブルで省略。tables の soft_delete: false）
    - { logical: 作成日時, physical: created_at, type: timestamptz, not_null: true, default: CURRENT_TIMESTAMP }
    - { logical: 作成者,   physical: created_by, type: varchar(10), not_null: true, default: "'SYSTEM'" }
    - { logical: 更新日時, physical: updated_at, type: timestamptz, not_null: true, default: CURRENT_TIMESTAMP, note: "トリガーで自動更新。楽観ロックの照合値（API ではマイクロ秒 6 桁で返し、クライアントはそのまま返送する）" }
    - { logical: 更新者,   physical: updated_by, type: varchar(10), not_null: true, default: "'SYSTEM'" }
    - { logical: 削除日時, physical: deleted_at, type: timestamptz, note: "論理削除（NULL=有効）。履歴テーブルは省略" }

# ---------------------------------------------------------------------
# tables：DDMSAA のテーブル定義。共通列（conventions.common_columns）は各テーブルに付与し、ここでは列挙しない。
#   soft_delete: false のテーブルは deleted_at を持たない（開発規約/spec-database-rule.md §4.3 EXCEPTION）。
#   id_prefix / id_width：§4.1-SEQ の採番（next_business_id）。users はアプリケーション層で A/E/C を指定。
# ---------------------------------------------------------------------
# rule: db.table-definitions
