      - { logical: 状態, physical: status, type: int, fk: true, not_null: true, references: "customer_status_codes.customer_status_code", note: "参照: 顧客状態（T07-3：1=ACTIVE, 2=INACTIVE）。" }
    indexes:
      - { name: pk_customers, columns: [id], type: 主キー, purpose: 主キー }
      - { name: uq_customers_customer_code, columns: [customer_code], type: 部分ユニーク, where: "deleted_at IS NULL", purpose: 一意性（未削除行のみ） }
      - { name: idx_customers_status, columns: [status], type: 一般, purpose: 外部キー（§6.2） }
    constraints:
      - { name: fk_customers_cus_sts_codes, type: 外部キー, content: "status → customer_status_codes.customer_status_code" }

  - id: TBL-customer-contacts
    physical_name: customer_contacts
    logical_name: 顧客連絡先
    type: 業務
    description: "顧客の連絡先・通知先"
    id_prefix: CC
    id_width: 8
    columns:
      - { logical: 顧客連絡先ID, physical: id, type: varchar(10), pk: true, not_null: true, default: "next_business_id('CC', 8)", note: "CC+8桁を採番" }
      - { logical: 顧客ID, physical: customer_id, type: varchar(10), fk: true, not_null: true, references: "customers.id" }
      - { logical: 連絡先名, physical: contact_name, type: varchar(100), not_null: true }
      - { logical: メールアドレス, physical: email, type: varchar(255), not_null: true }
      - { logical: 通知先フラグ, physical: is_notification_recipient, type: boolean, not_null: true, default: "FALSE" }
      - { logical: 有効フラグ, physical: is_active, type: boolean, not_null: true, default: "TRUE" }
    indexes:
      - { name: pk_customer_contacts, columns: [id], type: 主キー, purpose: 主キー }
      - { name: idx_cus_cnt_cus_id_is_active, columns: [customer_id, is_active], type: 一般, purpose: 検索 }
    constraints:
      - { name: fk_customer_contacts_customers, type: 外部キー, content: "customer_id → customers.id" }

  - id: TBL-customer-assignments
    physical_name: customer_assignments
    logical_name: 担当割当
    type: 業務
    description: "EMPLOYEE と担当顧客の割当（属性を持つため業務エンティティとして扱う）"
