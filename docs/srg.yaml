schemaVersion: 1
visualization:
  exclude:
    - readme-basic-design
    - readme-detail-design
    - eclipse-formatter
    - if-log-config
  groups:
    - id: message-list
      title: 共通メッセージ一覧
      members:
        - message-list-ui
        - message-list-ja
        - message-list-zh
        - message-list-en
      primary: message-list-ja
    - id: db-physical
      title: DB 物理設計
      members:
        - db-physical-ui
        - db-physical-yaml
      primary: db-physical-ui
    - id: database-rule
      title: DB 命名規約
      members:
        - database-rule
        - postgresql-column-types-rule
      primary: database-rule
    - id: sql-lint-rule
      title: SQL Lint 規約
      members:
        - sql-lint-rule
        - sqlfluff-rules-catalog
      primary: sql-lint-rule
    - id: db-connection
      title: DB 接続・構築設計
      members:
        - db-connection
        - db-connection-temp
        - db-foundation-temp
      primary: db-connection
    - id: generation-rule
      title: 生成共通規約
      members:
        - generation-rule
        - backend-scaffold-rule
      primary: generation-rule
nodes:
  - id: doc-standard
    path: 基本設計/共通/spec-00-doc-standard-ui.md
    title: 文書規約・共通ヘッダ
    defines:
      - id: doc.header-block
        summary: 各設計書の冒頭に文書ヘッダ（文書情報と改訂履歴）を貼り付ける
      - id: doc.id-prefix-scheme
        summary: 機能 F-/画面 SCR-/テーブル TBL-/バッチ BAT-/帳票 RPT-/業務フロー BF-/業務ルール BR-/データ移行 MIG-/運用作業 OPS-/外部IF IF- のID接頭辞体系を全文書で用いる
      - id: doc.id-role-prefix
        summary: ロールIDは R- + ロール列挙値とする
      - id: doc.output-file-naming
        summary: 帳票等の出力ファイル名は <帳票名>_YYYYMMDD.<拡張子>、複数ファイルは ZIP にまとめる（帳票固有の規則のみ帳票設計に記載）
  - id: naming-rule
    path: 開発規約/spec-naming-rule.md
    title: 命名規約
    defines:
      - id: naming.db-identifier-snake-case
        summary: DB の識別子（テーブル・列・制約・インデックス名）は snake_case
      - id: naming.db-table-plural
        summary: DB テーブル名は英語名詞の複数形
      - id: naming.backend-class-pascal-case
        summary: Backend のクラス・インタフェース名は PascalCase
      - id: naming.backend-entity-singular
        summary: Backend の Entity 名は単数形
      - id: naming.backend-member-camel-case
        summary: Backend のメソッド・変数・フィールド名は camelCase
      - id: naming.api-json-camel-case
        summary: API JSON のフィールド・パス/クエリパラメータ名は camelCase
      - id: naming.api-path-kebab-plural
        summary: API リソースパスは kebab-case の複数形
      - id: naming.api-enum-upper-snake
        summary: API の Enum 値は UPPER_SNAKE_CASE
      - id: naming.frontend-file-kebab-case
        summary: Frontend のファイル名は kebab-case
      - id: naming.frontend-union-type-no-enum
        summary: Frontend の列挙は Union Type とし TypeScript enum を禁止する
      - id: naming.english-only
        summary: 識別子は英語のみとし、中国語・ピンインを使用しない
      - id: naming.abbreviation-whitelist
        summary: 略語は §4 のホワイトリストに載るもののみ使用する
  - id: file-naming-rule
    path: 開発規約/spec-file-naming-rule.md
    title: ファイル命名規範
    defines:
      - id: fname.doc-file-naming
        summary: 文書・仕様ファイルは小文字 kebab-case の spec-[序号-][feature-]slug-分類接尾辞.ext とし、md と yaml の対は同一 slug を用いる
      - id: fname.test-doc-names
        summary: テスト文書のファイル名は spec-<対象>-unittest-sd.md / spec-it-<operationId>.md / spec-it-fe-<SCR-id>.md / *-testreport-<date>.md に従う
  - id: generation-rule
    path: 開発規約/spec-generation-rule.md
    title: 生成共通規約
    defines:
      - id: gen.conflict-priority-order
        summary: 規約の競合時は naming/database > 各層 coding-rule > 詳細設計 > yaml の順で上位を正とする
      - id: gen.line-ending-lf-no-bom
        summary: 生成ファイルは LF 改行・UTF-8 BOM なしとし、.gitattributes/.editorconfig で固定する
  - id: readme-basic-design
    path: 基本設計/README.md
    title: 基本設計テンプレート README
  - id: system-architecture
    path: 基本設計/共通/spec-01-system-architecture-ui.md
    title: システム構成・方式設計
    defines:
      - id: tech.jdk-version
        summary: JDK は 21（LTS）
      - id: tech.spring-boot-version
        summary: Spring Boot は 3.5.13（親 BOM）
      - id: tech.spring-cloud-version
        summary: Spring Cloud BOM は 2025.0.2
      - id: tech.postgresql-version
        summary: PostgreSQL は 16
      - id: tech.flyway-version
        summary: Flyway は 11.7.2（Spring Boot BOM 管理）
      - id: tech.mybatis-version
        summary: MyBatis（mybatis-spring-boot-starter）は 3.0.4
      - id: tech.mapstruct-version
        summary: MapStruct は 1.6.3
      - id: tech.pagehelper-version
        summary: PageHelper（pagehelper-spring-boot-starter）は 2.1.1
      - id: tech.jjwt-version
        summary: jjwt は 0.13.0
      - id: tech.aws-sdk-version
        summary: AWS SDK for Java v2 は 2.x
      - id: tech.poi-version
        summary: Apache POI は 5.4.1
      - id: tech.frontend-library-versions
        summary: Frontend ライブラリ版（React 19.1.x / TypeScript 5.9.x strict / Vite 7.x / Ant Design 5.x / React Router 7.x / axios 1.x / pnpm 10.x 等）
      - id: tech.frontend-architecture-spa
        summary: Frontend は React + TypeScript + Vite による SPA とし、REST API を介して Backend と分離する
      - id: tech.persistence-mybatis-only
        summary: 永続化層は MyBatis とし JPA を使用しない
      - id: time.system-timezone-asia-tokyo
        summary: システム（OS・アプリケーション・DB セッション）のタイムゾーンは Asia/Tokyo
      - id: mig.no-manual-prod-change
        summary: テーブル構造の変更は Flyway マイグレーションで行い、本番 DB の手動変更を禁止する
    uses:
      - doc.header-block
    dependsOn:
      - doc-standard
  - id: database-rule
    path: 開発規約/spec-database-rule.md
    title: DB 命名規約
    defines:
      - id: db.pk-default-varchar10
        summary: 主キーは既定で id VARCHAR(10) NOT NULL とし、VARCHAR 主キーに IDENTITY を使用しない
      - id: db.pk-numbering-function
        summary: 文字列主キーは public.next_business_id(prefix) で採番し、prefix ごとに seq_id_{prefix} シーケンスを用いる
      - id: db.pk-users-user-id
        summary: users は汎用 id ではなく業務キー user_id（VARCHAR(10)）を主キーとする
      - id: db.pk-shared-child
        summary: 1:1 / 1:0..1 の子テーブルは親の主キーを共有し、自身の id・採番を持たない
      - id: db.pk-natural-master
        summary: 条件を満たす設定・参照系 master テーブルは自然キーを主キーとし採番しない
      - id: db.fk-column-naming
        summary: 外部キー列は {被参照テーブル単数形}_id（VARCHAR）とする
      - id: db.common-columns
        summary: 全データテーブルに created_at/created_by/updated_at/updated_by/deleted_at を持たせる
      - id: db.soft-delete-column
        summary: 論理削除は deleted_at（TIMESTAMPTZ、NULL=有効）で表し、履歴・一時・中間・コードテーブルのみ省略宣言のうえ省略可
      - id: db.updated-at-trigger
        summary: updated_at は trg_set_updated_at_{table} トリガー（public.set_updated_at）で自動更新する
      - id: db.constraint-index-naming
        summary: 制約・インデックス名は pk_/fk_/uq_/idx_/chk_ + テーブル名（+列名）の形式とする
      - id: db.enum-code-table
        summary: 列挙・ステータスは INT コードで保存し、列挙型ごとのコードテーブルへの外部キーで値域を制約する（CHECK 制約・ENUM 型を使わない）
      - id: time.db-timestamptz
        summary: 日時列は TIMESTAMPTZ とし、DB セッションのタイムゾーンはシステムタイムゾーン（Asia/Tokyo）に一致させる
      - id: db.type-mapping
        summary: データ型は §5 のマッピング表に厳格に従い、金額は NUMERIC(15,2)・真偽値は BOOLEAN とする（FLOAT/DOUBLE を使わない）
    uses:
      - naming.db-identifier-snake-case
      - naming.db-table-plural
      - time.system-timezone-asia-tokyo
      - naming.english-only
      - naming.abbreviation-whitelist
    dependsOn:
      - naming-rule
      - system-architecture
  - id: data-dictionary-rule
    path: 開発規約/spec-data-dictionary-rule.md
    title: データ辞書規範
    defines:
      - id: enum.value-source-t07
        summary: 列挙値の唯一の定義元はプロジェクトデータ辞書の T07 とする
      - id: enum.category-code-rule
        summary: T07 の category_code は一意で、追加時は最大値+1、廃止番号は再利用しない
      - id: enum.code-table-rows
        summary: コードテーブルの行（コード・英語名）は T07 の定義と一致させる
      - id: enum.change-order
        summary: 列挙値変更の順序は 拡大=辞書→コードテーブル→Enum、縮小=辞書→Enum→履歴整理→コードテーブル
      - id: dict.encrypted-type-varchar512
        summary: 暗号化列はアプリ層で暗号化した暗号文を VARCHAR(512) で保存する
    uses:
      - db.pk-default-varchar10
      - db.common-columns
      - db.updated-at-trigger
      - db.enum-code-table
      - time.db-timestamptz
      - db.pk-numbering-function
      - db.pk-users-user-id
      - db.pk-shared-child
      - db.pk-natural-master
      - db.type-mapping
      - time.api-iso8601-offset
    dependsOn:
      - database-rule
      - api-list-ui
  - id: data-dictionary-project-temp
    path: 開発規約/spec-data-dictionary-project-temp.md
    title: プロジェクトデータ辞書テンプレート
    defines:
      - id: enum.t07-values
        summary: 各列挙型のコード値・属性名・英語名・category_code は T07（第2部）に登録する
    uses:
      - enum.value-source-t07
      - enum.category-code-rule
      - enum.code-table-rows
      - enum.change-order
    dependsOn:
      - data-dictionary-rule
  - id: postgresql-column-types-rule
    path: 開発規約/spec-postgresql-column-types-rule.md
    title: PostgreSQL カラム型一覧
    uses:
      - tech.postgresql-version
      - db.type-mapping
    dependsOn:
      - system-architecture
      - database-rule
  - id: sql-lint-rule
    path: 開発規約/spec-sql-lint-rule.md
    title: SQL Lint 規約
    defines:
      - id: lint.rule-set
        summary: SQLFluff（postgres/raw）のルールセットは キーワード大文字・識別子/関数小文字・行長200 等を採用する
      - id: lint.pre-execution-gate
        summary: V*/R__/setup/*.sql は実行前に sqlfluff lint を通過させる
    uses:
      - naming.db-identifier-snake-case
      - tech.postgresql-version
      - gen.line-ending-lf-no-bom
    dependsOn:
      - naming-rule
      - system-architecture
      - generation-rule
  - id: sqlfluff-rules-catalog
    path: 開発規約/spec-sqlfluff-rules-catalog.md
    title: SQLFluff ルール全集一覧
    uses:
      - lint.rule-set
    dependsOn:
      - sql-lint-rule
  - id: flyway-migration-rule
    path: 開発規約/spec-flyway-migration-rule.md
    title: Flyway マイグレーション規約
    defines:
      - id: mig.version-file-naming
        summary: マイグレーションは V<version>__<snake_case説明>.sql（反復は R__<説明>.sql）とし、V1=初期移行データ・構造変更は V2 以降
      - id: mig.applied-script-immutable
        summary: 適用済み V* は変更せず、修正は上位バージョンの新規 V* で行う
        external: true
    uses:
      - mig.two-mechanism-split
      - mig.baseline-zero-v1-initial-data
      - mig.script-location
      - db.table-definitions
      - db.pk-default-varchar10
      - db.enum-code-table
      - db.common-columns
      - db.updated-at-trigger
      - dict.encrypted-type-varchar512
      - tech.flyway-version
      - tech.postgresql-version
      - gen.line-ending-lf-no-bom
      - lint.pre-execution-gate
      - naming.db-identifier-snake-case
      - db.type-mapping
    dependsOn:
      - naming-rule
      - system-architecture
      - database-rule
      - data-dictionary-rule
      - sql-lint-rule
      - db-physical-yaml
      - db-migration
      - generation-rule
  - id: auth-design
    path: 基本設計/共通/spec-03-auth-ui.md
    title: 権限設計
    defines:
      - id: auth.three-layer-permission
        summary: 権限は 操作権限 ∩ データ範囲（行）∩ 項目参照（列）の三層で判定する
      - id: auth.field-visibility-matrix
        summary: 他者情報の項目別参照可否は項目単位の参照権限マトリクスに従う
    uses:
      - doc.header-block
      - doc.id-role-prefix
    dependsOn:
      - doc-standard
  - id: db-physical-ui
    path: 基本設計/共通/spec-06-db-physical-ui.md
    title: DB 物理設計
    defines:
      - id: db.soft-delete-partial-unique
        summary: deleted_at を持つテーブルの業務一意列は、未削除行のみ対象の部分ユニークインデックス（WHERE deleted_at IS NULL）で保証する
    uses:
      - doc.header-block
      - doc.id-prefix-scheme
      - naming.db-table-plural
      - naming.db-identifier-snake-case
      - db.pk-default-varchar10
      - db.pk-numbering-function
      - db.pk-users-user-id
      - db.pk-shared-child
      - db.pk-natural-master
      - db.common-columns
      - db.soft-delete-column
      - mig.no-manual-prod-change
      - tech.postgresql-version
      - db.enum-code-table
    dependsOn:
      - doc-standard
      - naming-rule
      - system-architecture
      - database-rule
  - id: db-physical-yaml
    path: 基本設計/共通/spec-06-db-physical.yaml
    title: DB 物理設計（機械可読）
    defines:
      - id: db.table-definitions
        summary: テーブル・列・型・インデックス・制約の唯一の定義源（DDL・Entity 生成の根拠）
    uses:
      - db.soft-delete-partial-unique
      - db.pk-default-varchar10
      - db.pk-numbering-function
      - db.pk-users-user-id
      - db.pk-shared-child
      - db.pk-natural-master
      - db.fk-column-naming
      - db.common-columns
      - db.soft-delete-column
      - db.enum-code-table
      - db.constraint-index-naming
      - dict.encrypted-type-varchar512
      - naming.db-table-plural
      - naming.db-identifier-snake-case
      - enum.t07-values
      - tech.postgresql-version
      - time.system-timezone-asia-tokyo
    dependsOn:
      - naming-rule
      - system-architecture
      - database-rule
      - data-dictionary-rule
      - data-dictionary-project-temp
      - db-physical-ui
  - id: api-list-ui
    path: 基本設計/共通/spec-07-api-list-ui.md
    title: API 一覧・定義
    defines:
      - id: api.base-path-v1
        summary: API のベースパスは /api/v1
      - id: api.auth-jwt-bearer
        summary: 公開エンドポイントを除き JWT Bearer（Authorization ヘッダ）で認証する
      - id: api.operation-id-identifier
        summary: API の正式識別子は operationId とし API-0NN 形式の採番を使用しない
      - id: api.operation-id-camel-verb
        summary: operationId は camelCase の動詞とする
      - id: api.paging-params
        summary: 一覧 API のページングは pageNum/pageSize（既定 1/20、pageSize 上限 100、超過は 400）で統一し PageResult<T> で返す
      - id: api.http-status-set
        summary: API が返す HTTP ステータスは 200/400/401/403/404/409/413/429/500/502/504 の固定集合とする
      - id: api.status-independent-of-message-id
        summary: HTTP ステータスは例外種別で決まり messageId とは独立とする
      - id: api.returns-message-id-only
        summary: API は表示文言を返さず messageId（+messageArgs）のみ返す
      - id: api.file-response-unwrapped
        summary: ファイル系レスポンスは Result で包まず、バイナリと Content-Disposition を直接返す
      - id: time.api-iso8601-offset
        summary: API の日時は +09:00 オフセット付き ISO 8601 文字列とし、Z / UTC 表記を用いない
    uses:
      - doc.header-block
      - doc.id-prefix-scheme
      - naming.api-path-kebab-plural
      - naming.api-json-camel-case
      - naming.api-enum-upper-snake
      - auth.three-layer-permission
    dependsOn:
      - doc-standard
      - naming-rule
      - auth-design
  - id: api-list-yaml
    path: 基本設計/共通/spec-07-api-list.yaml
    title: API 一覧（機械可読 OpenAPI）
    defines:
      - id: api.envelope-schemas
        summary: Result/PageResult/ErrorResponse/FieldError の項目構造
      - id: api.endpoint-definitions
        summary: エンドポイント・operationId・リクエスト/レスポンス schema・列挙値の機械可読な唯一の定義源
    uses:
      - api.base-path-v1
      - api.auth-jwt-bearer
      - api.operation-id-identifier
      - api.operation-id-camel-verb
      - api.paging-params
      - api.http-status-set
      - api.returns-message-id-only
      - naming.api-path-kebab-plural
      - naming.api-json-camel-case
      - naming.api-enum-upper-snake
      - enum.t07-values
      - time.api-iso8601-offset
    dependsOn:
      - naming-rule
      - data-dictionary-project-temp
      - api-list-ui
  - id: external-interface
    path: 基本設計/共通/spec-08-external-interface-ui.md
    title: 外部インタフェース設計
    uses:
      - doc.header-block
      - doc.id-prefix-scheme
      - doc.output-file-naming
      - api.file-response-unwrapped
    dependsOn:
      - doc-standard
      - api-list-ui
  - id: message-list-ui
    path: 基本設計/共通/spec-09-message-list-ui.md
    title: 共通メッセージ一覧
    defines:
      - id: msg.id-format
        summary: messageId は [IWE]NNNN（区分1文字+4桁連番、ハイフンなし）
      - id: msg.category-iwe-no-c
        summary: メッセージ区分は I/W/E の3種とし C 区分は設けず、確認ダイアログは W に含める
      - id: msg.number-bands
        summary: 共通メッセージの番号帯（E0001〜E0013 認証等 / E0020 ログイン不可 / E0030〜E0034 クライアント検証 / E0040〜E0043 Gateway / I・W の共通番号）
      - id: msg.no-hardcoded-text
        summary: 画面・API は messageId で参照し、文言をハードコードしない
      - id: msg.id-must-exist-in-catalog
        summary: 使用する messageId はカタログ（ja 正本 yaml）に存在しなければならない
    uses:
      - doc.header-block
      - api.status-independent-of-message-id
    dependsOn:
      - doc-standard
      - api-list-ui
  - id: message-list-ja
    path: 基本設計/共通/spec-09-message-list.yaml
    title: 共通メッセージ一覧（日本語正本）
    defines:
      - id: msg.catalog-entries
        summary: 個々の messageId と日本語文言・区分の唯一の定義源（zh/en は翻訳）
    uses:
      - msg.id-format
      - msg.category-iwe-no-c
      - msg.number-bands
    dependsOn:
      - message-list-ui
  - id: message-list-zh
    path: 基本設計/共通/spec-09-message-list.zh.yaml
    title: 共通メッセージ一覧（中国語）
    uses:
      - msg.catalog-entries
      - msg.number-bands
    dependsOn:
      - message-list-ui
      - message-list-ja
  - id: message-list-en
    path: 基本設計/共通/spec-09-message-list.en.yaml
    title: 共通メッセージ一覧（英語）
    uses:
      - msg.catalog-entries
      - msg.number-bands
    dependsOn:
      - message-list-ui
      - message-list-ja
  - id: non-functional
    path: 基本設計/共通/spec-11-non-functional-ui.md
    title: 非機能要件
    uses:
      - doc.header-block
      - tech.postgresql-version
      - time.system-timezone-asia-tokyo
      - auth.three-layer-permission
    dependsOn:
      - doc-standard
      - system-architecture
      - auth-design
  - id: screen-common
    path: 基本設計/共通/spec-12-screen-common-ui.md
