  - id: backend-coding-rule
    path: 開発規約/spec-backend-coding-rule.md
    title: Backend 開発規約
    defines:
      - id: be.layering-responsibilities
        summary: Controller/Service/ServiceImpl/Mapper/Entity/DTO/Converter の責務と禁止事項に従う（Controller は Entity を返さず DTO を Result<T> で包む）
      - id: be.converter-mapstruct
        summary: Entity↔DTO の変換は Converter（MapStruct の @Mapper）で行い、手書きの Converter・マッピングを使わない
      - id: be.mybatis-mapper-xml
        summary: 1 Entity = 1 Mapper IF + 同名 XML とし、resultMap と <where>/<if> を用い文字列連結 SQL を禁止する
      - id: be.paging-pagehelper-pageresult
        summary: ページングは PageHelper を用い PageResult<T> に統一する
      - id: be.transaction-serviceimpl-only
        summary: '@Transactional は ServiceImpl のメソッドにのみ付与する'
      - id: be.soft-delete-query
        summary: Mapper の全クエリは WHERE deleted_at IS NULL を明示し、削除は UPDATE deleted_at とする（物理 DELETE 禁止）
      - id: be.method-security-preauthorize
        summary: 機能レベル権限は Controller メソッドの @PreAuthorize(hasRole(...)) で強制する
      - id: err.exception-to-http-mapping
        summary: 例外型→HTTP は 400/401/403/404/409/413/429/500/502/504 の固定マッピングとし、messageId の既定値を例外ごとに定める
      - id: err.business-exception-only
        summary: 業務失敗は BusinessException(messageId, args...) のみで表し、戻りコード・マジック文字列を使わない
    uses:
      - naming.backend-class-pascal-case
      - naming.backend-entity-singular
