      - id: test.it-id-format
        summary: IT-ID は API 結合 IT-<operationId>-NNN、画面結合 IT-<SCR-id>-NNN とする
        external: true
      - id: test.displayname-id-first
        summary: 機能紐付きテストの @DisplayName / it() 名は先頭に UT/IT-ID を置き、1ケース=1ID=1テストメソッドとする
        external: true
