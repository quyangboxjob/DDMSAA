server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost:5434/ddmsaa?currentSchema=public
    username: ${DB_USERNAME:ddmsaa}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    baseline-on-migrate: true
    baseline-version: "0"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ddmsaa}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  auth:
    magic-link:
      ttl-seconds: ${MAGIC_LINK_TTL_SECONDS:3600}
      base-url: ${MAGIC_LINK_BASE_URL:http://localhost:3000/auth/verify}
    mail-from: ${MAIL_FROM:no-reply@ddmsaa.local}
    # 汎用 AuthStateStore の予約値。DDMSAA の auth-service は失敗回数ロックを使用しない。
    max-login-failure-count: 5
    login-lockout-seconds: 1800
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # SMTP の停止でサービス全体を DOWN にしない（メール送信失敗は warn ログ）
