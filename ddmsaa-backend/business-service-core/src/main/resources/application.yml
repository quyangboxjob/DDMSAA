server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: business-service-core
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    baseline-on-migrate: true
    baseline-version: "0"
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: postgresql

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ddmsaa}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  services:
    auth:
      base-url: ${AUTH_SERVICE_URI:http://localhost:8081}
    connect-timeout-seconds: 5
    read-timeout-seconds: 30
  crypto:
    aes-key: ${AES_KEY}
  file:
    storage-type: ${FILE_STORAGE_TYPE:local}
    local:
      base-dir: ${FILE_LOCAL_BASE_DIR:${java.io.tmpdir}/ddmsaa-files}
    s3:
      region: ${S3_REGION:ap-northeast-1}
      bucket: ${S3_BUCKET:ddmsaa}
      prefix: ${S3_PREFIX:}
      endpoint: ${S3_ENDPOINT:}
      path-style: ${S3_PATH_STYLE:false}
      presign-ttl-seconds: ${S3_PRESIGN_TTL_SECONDS:300}
  export:
    file-expiry-hours: 24
  scan:
    type: ${SCAN_TYPE:none}
    clamd:
      host: ${CLAMD_HOST:localhost}
      port: ${CLAMD_PORT:3310}
      timeout-seconds: 30
  mail:
    from: ${MAIL_FROM:no-reply@ddmsaa.local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # SMTP の停止でサービス全体を DOWN にしない（メール送信失敗は warn ログ）
